<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS — BESTIÁRIO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#09050f;
    --bg2:#12091c;
    --panel:#160d22;
    --panel2:#1d112b;
    --border:#392052;
    --purple:#a96cff;
    --purple2:#6d32c9;
    --text:#f4edff;
    --muted:#9d91ad;
    --green:#38d47b;
    --yellow:#e8c54f;
    --orange:#e8873d;
    --red:#e94b62;
    --darkred:#851d31;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%, #32124e 0%, transparent 38%),
        radial-gradient(circle at 100% 100%, #170c27 0%, transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Georgia, "Times New Roman", serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:space-between;

    min-height:76px;
    padding:15px 5%;

    background:rgba(9,5,15,.88);
    backdrop-filter:blur(16px);

    border-bottom:1px solid var(--border);
}

.logo{
    color:white;
    font-size:30px;
    font-weight:bold;
    letter-spacing:8px;

    text-shadow:
        0 0 10px rgba(169,108,255,.8),
        0 0 30px rgba(169,108,255,.35);
}

.header-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.header-btn{
    padding:10px 15px;
    border:1px solid var(--border);
    border-radius:10px;

    color:var(--text);
    background:#140b1d;

    transition:.2s;
}

.header-btn:hover{
    border-color:var(--purple);
    box-shadow:0 0 15px rgba(169,108,255,.2);
}

.container{
    width:min(1200px,92%);
    margin:0 auto;
    padding:50px 0 80px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:30px;
}

.title-area h1{
    font-size:clamp(35px,6vw,58px);
    letter-spacing:4px;
}

.title-area p{
    margin-top:8px;
    color:var(--muted);
}

.primary-btn{
    border:1px solid #9b5df4;
    border-radius:12px;
    padding:13px 19px;

    color:white;
    background:linear-gradient(
        135deg,
        #7838c6,
        #4c2182
    );

    box-shadow:0 0 22px rgba(135,66,211,.25);
}

.primary-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 0 30px rgba(169,108,255,.35);
}

.search-box{
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    padding:15px 18px;

    color:white;
    background:rgba(20,11,30,.85);

    border:1px solid var(--border);
    border-radius:12px;

    outline:none;
}

.search-box input:focus{
    border-color:var(--purple);
    box-shadow:0 0 20px rgba(169,108,255,.12);
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:30px;
}

.filter{
    padding:9px 14px;

    color:var(--muted);
    background:#12091a;

    border:1px solid var(--border);
    border-radius:999px;

    transition:.2s;
}

.filter:hover,
.filter.active{
    color:white;
    border-color:var(--purple);
    background:#28123c;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
    gap:20px;
}

.card{
    overflow:hidden;

    background:linear-gradient(
        145deg,
        rgba(29,17,43,.97),
        rgba(15,8,23,.97)
    );

    border:1px solid var(--border);
    border-radius:16px;

    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#71429a;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.card-image{
    height:260px;
    background:#0b0710;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.no-image{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#64566e;
    letter-spacing:2px;
}

.card-content{
    padding:17px;
}

.card-name{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.card-info{
    display:flex;
    flex-direction:column;
    gap:4px;

    color:var(--muted);
    font-size:14px;
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin-top:16px;
}

.badge{
    padding:6px 10px;
    border-radius:999px;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.badge.baixo{
    color:#65e995;
    background:rgba(56,212,123,.12);
}

.badge.moderado{
    color:#e8d65d;
    background:rgba(232,197,79,.12);
}

.badge.alto{
    color:#f09a55;
    background:rgba(232,135,61,.12);
}

.badge.extremo{
    color:#ff647b;
    background:rgba(233,75,98,.12);
}

.badge.desconhecido{
    color:#c4a8e7;
    background:rgba(169,108,255,.12);
}

.level-label{
    color:#c9b6dc;
    font-size:13px;
}

.empty{
    grid-column:1/-1;

    padding:60px 20px;
    text-align:center;

    border:1px dashed var(--border);
    border-radius:16px;

    color:var(--muted);
}

.empty strong{
    display:block;
    color:white;
    font-size:20px;
    margin-bottom:8px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(850px,100%);
    max-height:92vh;
    overflow:auto;

    padding:25px;

    background:
        linear-gradient(
            145deg,
            #1a0d27,
            #0e0715
        );

    border:1px solid var(--border);
    border-radius:18px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 40px rgba(117,51,178,.12);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.modal-header h2{
    font-size:26px;
    letter-spacing:2px;
}

.close{
    width:40px;
    height:40px;

    border:1px solid var(--border);
    border-radius:10px;

    color:white;
    background:#160b20;

    font-size:27px;
}

.close:hover{
    border-color:var(--purple);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.section-title{
    grid-column:1/-1;

    padding:13px 0 8px;
    margin-top:10px;

    color:#c79bff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:3px;

    border-bottom:1px solid var(--border);
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#cbbbd6;
    font-size:14px;
}

.field input,
.field textarea,
.field select{
    width:100%;

    padding:12px 13px;

    color:white;
    background:#0d0713;

    border:1px solid var(--border);
    border-radius:9px;

    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--purple);
    box-shadow:0 0 15px rgba(169,108,255,.1);
}

.field textarea{
    min-height:130px;
    resize:vertical;
}

.image-preview{
    width:100%;
    min-height:150px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#0a060e;
    border:1px dashed var(--border);
    border-radius:12px;
}

.image-preview img{
    display:block;
    width:100%;
    max-height:350px;
    object-fit:contain;
}

.remove-image-btn{
    display:none;

    padding:9px;

    color:#ff778a;
    background:#24101a;

    border:1px solid #632432;
    border-radius:8px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;

    margin-top:25px;
}

.secondary{
    color:#d7c9df;
    background:#160b20;
    border:1px solid var(--border);
}

.delete-btn{
    margin-right:auto;

    padding:11px 16px;

    color:#ff6c80;
    background:#260e17;

    border:1px solid #652431;
    border-radius:9px;
}

/* =========================
   FICHA
========================= */

.sheet{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.sheet-main-image{
    width:100%;
    height:min(500px,55vh);

    overflow:hidden;

    border-radius:15px;
    border:1px solid var(--border);

    background:#09050d;
}

.sheet-main-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.sheet-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#65556f;
}

.sheet-title{
    font-size:42px;
    font-weight:bold;
    line-height:1.1;
}

.sheet-origin{
    margin-top:6px;
    color:#aa9ab7;
    font-size:16px;
}

.sheet-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    padding:14px;

    background:#100817;
    border:1px solid var(--border);
    border-radius:10px;
}

.stat-label{
    display:block;
    margin-bottom:5px;

    color:#887793;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    color:white;
    font-size:16px;
}

/* =========================
   VIDA / RESISTÊNCIA
========================= */

.resource-box{
    position:relative;

    padding:19px;

    background:
        linear-gradient(
            145deg,
            rgba(31,16,44,.95),
            rgba(13,7,18,.95)
        );

    border:1px solid var(--border);
    border-radius:14px;

    overflow:hidden;
}

.resource-header{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin-bottom:12px;
}

.resource-name{
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
}

.resource-number{
    font-size:25px;
    font-weight:bold;

    letter-spacing:1px;
}

.resource-bar{
    width:100%;
    height:18px;

    overflow:hidden;

    background:#09050d;

    border:1px solid #3c254c;
    border-radius:999px;
}

.resource-fill{
    height:100%;
    width:100%;

    border-radius:999px;

    transition:
        width .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}

.resource-status{
    margin-top:9px;

    color:#a99aaa;
    font-size:13px;
    font-style:italic;
}

.resource-edit{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-top:15px;
}

.resource-edit label{
    display:flex;
    flex-direction:column;
    gap:5px;

    color:#8d7d97;
    font-size:11px;
    text-transform:uppercase;
}

.resource-edit input{
    width:100%;

    padding:9px;

    color:white;
    background:#0a060e;

    border:1px solid var(--border);
    border-radius:7px;
}

/* =========================
   ATRIBUTOS
========================= */

.attributes{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.attribute{
    padding:14px 16px;

    background:#100817;
    border:1px solid var(--border);
    border-radius:10px;
}

.attribute-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.attribute-name{
    font-weight:bold;
}

.attribute-controls{
    display:flex;
    align-items:center;
    gap:9px;
}

.attribute-value{
    min-width:40px;
    text-align:center;

    font-weight:bold;
    font-size:19px;
}

.attr-btn{
    width:30px;
    height:30px;

    border:1px solid var(--border);
    border-radius:7px;

    color:white;
    background:#1a0c25;
}

.attr-btn:hover{
    border-color:var(--purple);
}

.notes{
    padding:18px;

    white-space:pre-wrap;

    line-height:1.7;

    color:#d3c7db;

    background:#0e0714;
    border:1px solid var(--border);
    border-radius:12px;
}

.sheet-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    header{
        padding:12px 4%;
    }

    .logo{
        font-size:22px;
        letter-spacing:5px;
    }

    .header-actions{
        gap:5px;
    }

    .header-btn{
        padding:8px 9px;
        font-size:12px;
    }

    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full,
    .section-title{
        grid-column:auto;
    }

    .sheet-stats{
        grid-template-columns:repeat(2,1fr);
    }

    .sheet-title{
        font-size:32px;
    }

    .resource-number{
        font-size:21px;
    }

    .modal-box{
        padding:18px;
    }

    .modal-actions{
        flex-wrap:wrap;
    }

    .delete-btn{
        width:100%;
        margin-right:0;
    }
}

@media(max-width:430px){

    .sheet-stats{
        grid-template-columns:1fr;
    }

    .resource-edit{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">NEXUS</div>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="exportBestiary()"
        >
            ↓ EXPORTAR
        </button>

        <button
            class="header-btn"
            onclick="document.getElementById('importFile').click()"
        >
            ↑ IMPORTAR
        </button>

        <input
            id="importFile"
            type="file"
            accept=".json,application/json"
            style="display:none"
            onchange="importBestiary(event)"
        >

    </div>

</header>


<main class="container">

    <div class="topbar">

        <div class="title-area">

            <h1>BESTIÁRIO</h1>

            <p>
                Registre, descubra e catalogue criaturas.
            </p>

        </div>

        <button
            class="primary-btn"
            onclick="openCreateModal()"
        >
            + NOVA CRIATURA
        </button>

    </div>


    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Pesquisar criatura..."
            oninput="renderCreatures()"
        >

    </div>


    <div class="filters">

        <button
            class="filter active"
            onclick="setFilter('todos',this)"
        >
            TODOS
        </button>

        <button
            class="filter"
            onclick="setFilter('baixo',this)"
        >
            BAIXO
        </button>

        <button
            class="filter"
            onclick="setFilter('moderado',this)"
        >
            MODERADO
        </button>

        <button
            class="filter"
            onclick="setFilter('alto',this)"
        >
            ALTO
        </button>

        <button
            class="filter"
            onclick="setFilter('extremo',this)"
        >
            EXTREMO
        </button>

        <button
            class="filter"
            onclick="setFilter('desconhecido',this)"
        >
            ???
        </button>

    </div>


    <div
        id="creatureGrid"
        class="grid"
    ></div>

</main>


<!-- =========================
     MODAL EDITOR
========================= -->

<div
    id="editorModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="editorTitle">
                NOVA CRIATURA
            </h2>

            <button
                class="close"
                onclick="closeEditor()"
            >
                ×
            </button>

        </div>


        <form id="creatureForm">

            <input
                id="creatureId"
                type="hidden"
            >


            <div class="form-grid">

                <div class="section-title">
                    IDENTIDADE
                </div>


                <div class="field full">

                    <label>
                        Imagem
                    </label>

                    <input
                        id="creatureImage"
                        type="file"
                        accept="image/*"
                    >

                    <div
                        id="imagePreview"
                        class="image-preview"
                    >
                        <span style="color:#62536d">
                            Nenhuma imagem selecionada
                        </span>
                    </div>

                    <button
                        id="removeImageBtn"
                        type="button"
                        class="remove-image-btn"
                        onclick="removeImage()"
                    >
                        Remover imagem
                    </button>

                </div>


                <div class="field">

                    <label>Nome</label>

                    <input
                        id="creatureName"
                        required
                    >

                </div>


                <div class="field">

                    <label>Level</label>

                    <input
                        id="creatureLevel"
                        type="number"
                        min="0"
                        value="1"
                    >

                </div>


                <div class="field">

                    <label>Origem</label>

                    <input id="creatureOrigin">

                </div>


                <div class="field">

                    <label>Altura</label>

                    <input
                        id="creatureHeight"
                        placeholder="Ex.: 1,85 m"
                    >

                </div>


                <div class="field">

                    <label>Peso</label>

                    <input
                        id="creatureWeight"
                        placeholder="Ex.: 80 kg"
                    >

                </div>


                <div class="field">

                    <label>Periculosidade</label>

                    <select id="creatureDanger">

                        <option value="baixo">
                            Baixo
                        </option>

                        <option value="moderado">
                            Moderado
                        </option>

                        <option value="alto">
                            Alto
                        </option>

                        <option value="extremo">
                            Extremo
                        </option>

                        <option value="desconhecido">
                            ???
                        </option>

                    </select>

                </div>


                <div class="section-title">
                    VIDA E RESISTÊNCIA
                </div>


                <div class="field">

                    <label>Vida atual</label>

                    <input
                        id="creatureHealth"
                        type="number"
                        min="0"
                        value="100"
                    >

                </div>


                <div class="field">

                    <label>Vida máxima</label>

                    <input
                        id="creatureHealthMax"
                        type="number"
                        min="1"
                        value="100"
                    >

                </div>


                <div class="field">

                    <label>Resistência atual</label>

                    <input
                        id="creatureResistance"
                        type="number"
                        min="0"
                        value="100"
                    >

                </div>


                <div class="field">

                    <label>Resistência máxima</label>

                    <input
                        id="creatureResistanceMax"
                        type="number"
                        min="1"
                        value="100"
                    >

                </div>


                <div class="section-title">
                    ATRIBUTOS
                </div>


                <div class="field full">

                                   <div class="field full">

                    <div id="attributesEditor"></div>

                </div>


                <div class="section-title">
                    ANOTAÇÕES IMPORTANTES
                </div>


                <div class="field full">

                    <label>
                        Anotações
                    </label>

                    <textarea
                        id="creatureNotes"
                        placeholder="Escreva informações importantes sobre esta criatura..."
                    ></textarea>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="deleteButton"
                    class="delete-btn"
                    onclick="deleteCreature()"
                    style="display:none"
                >
                    EXCLUIR CRIATURA
                </button>

                <button
                    type="button"
                    class="header-btn secondary"
                    onclick="closeEditor()"
                >
                    CANCELAR
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    SALVAR CRIATURA
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     MODAL FICHA
========================= -->

<div
    id="sheetModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                FICHA DA CRIATURA
            </h2>

            <button
                class="close"
                onclick="closeSheet()"
            >
                ×
            </button>

        </div>


        <div
            id="sheetContent"
            class="sheet"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const STORAGE_KEY = "nexus_bestiario_creatures_v3";

let creatures = [];
let currentFilter = "todos";
let currentEditingId = null;

let currentImageData = "";


/* =========================================================
   ATRIBUTOS
========================================================= */

const ATTRIBUTE_CONFIG = {

    forca: {
        name: "Força"
    },

    destreza: {
        name: "Destreza"
    },

    determinacao: {
        name: "Determinação"
    },

    inteligencia: {
        name: "Inteligência"
    },

    reflexos: {
        name: "Reflexos"
    }

};


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    loadBestiary();

    renderCreatures();

    createAttributeEditors();

});


/* =========================================================
   STORAGE
========================================================= */

function loadBestiary(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(!saved){

            creatures = [];

            return;

        }

        const parsed = JSON.parse(saved);

        if(Array.isArray(parsed)){

            creatures = parsed;

        }else if(
            parsed &&
            Array.isArray(parsed.creatures)
        ){

            creatures = parsed.creatures;

        }else{

            creatures = [];

        }

        creatures = creatures.map(normalizeCreature);

    }catch(error){

        console.error(error);

        creatures = [];

    }

}


function saveBestiary(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(creatures)
        );

    }catch(error){

        console.error(error);

        alert(
            "Não foi possível salvar no navegador.\n\n" +
            "A imagem pode ser grande demais para o armazenamento local."
        );

    }

}


/* =========================================================
   NORMALIZAR CRIATURA
========================================================= */

function normalizeCreature(creature){

    const c = creature || {};

    const attributes = {};

    Object.keys(ATTRIBUTE_CONFIG).forEach(key => {

        let values =
            c.attributes &&
            Array.isArray(c.attributes[key])
                ? c.attributes[key]
                : [];

        attributes[key] = values.map(item => {

            if(typeof item === "number"){

                return {
                    label: "",
                    value: Number(item) || 0
                };

            }

            return {

                label:
                    typeof item.label === "string"
                        ? item.label
                        : "",

                value:
                    Number(item.value) || 0

            };

        });

    });


    const healthMax =
        Math.max(
            1,
            Number(c.healthMax) || 100
        );

    const resistanceMax =
        Math.max(
            1,
            Number(c.resistanceMax) || 100
        );


    return {

        id:
            c.id ||
            crypto.randomUUID(),

        image:
            typeof c.image === "string"
                ? c.image
                : "",

        name:
            c.name ||
            "Criatura sem nome",

        level:
            Math.max(
                0,
                Number(c.level) || 0
            ),

        origin:
            c.origin || "",

        height:
            c.height || "",

        weight:
            c.weight || "",

        danger:
            ATTRIBUTE_DANGER(c.danger),

        health:
            clamp(
                Number(c.health) || 0,
                0,
                healthMax
            ),

        healthMax,

        resistance:
            clamp(
                Number(c.resistance) || 0,
                0,
                resistanceMax
            ),

        resistanceMax,

        attributes,

        notes:
            c.notes || "",

        createdAt:
            c.createdAt ||
            Date.now()

    };

}


function ATTRIBUTE_DANGER(value){

    const allowed = [
        "baixo",
        "moderado",
        "alto",
        "extremo",
        "desconhecido"
    ];

    return allowed.includes(value)
        ? value
        : "baixo";

}


function clamp(value,min,max){

    return Math.min(
        Math.max(value,min),
        max
    );

}


/* =========================================================
   ID
========================================================= */

function newId(){

    if(window.crypto && crypto.randomUUID){

        return crypto.randomUUID();

       }

    return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
    );

}


/* =========================================================
   EDITOR DE ATRIBUTOS
========================================================= */

function createAttributeEditors(values = null){

    const container =
        document.getElementById("attributesEditor");

    if(!container)
        return;

    container.innerHTML = "";

    Object.entries(ATTRIBUTE_CONFIG).forEach(
        ([key, config]) => {

            const section =
                document.createElement("div");

            section.className =
                "attribute-editor-section";

            section.innerHTML = `
                <div class="attribute-editor-header">
                    <strong>${config.name}</strong>

                    <button
                        type="button"
                        class="add-attribute-btn"
                        onclick="addAttribute('${key}')"
                    >
                        + ADICIONAR
                    </button>
                </div>

                <div
                    id="attribute-list-${key}"
                    class="attribute-editor-list"
                ></div>
            `;

            container.appendChild(section);

            const list =
                section.querySelector(
                    `#attribute-list-${key}`
                );

            const attributeValues =
                values?.[key] || [];

            if(attributeValues.length){

                attributeValues.forEach(
                    item => {
                        addAttribute(
                            key,
                            item.label,
                            item.value
                        );
                    }
                );

            }else{

                addAttribute(
                    key,
                    "",
                    0
                );

            }

        }
    );

}


/* =========================================================
   ADICIONAR ATRIBUTO
========================================================= */

function addAttribute(
    key,
    label = "",
    value = 0
){

    const list =
        document.getElementById(
            `attribute-list-${key}`
        );

    if(!list)
        return;


    const row =
        document.createElement("div");

    row.className =
        "attribute-editor-row";


    row.innerHTML = `
        <input
            type="text"
            class="attribute-label"
            placeholder="Nome / descrição"
            value="${escapeAttribute(label)}"
        >

        <div class="attribute-number-control">

            <button
                type="button"
                onclick="changeEditorAttributeValue(this,-1)"
            >
                −
            </button>

            <input
                type="number"
                class="attribute-value-input"
                value="${Number(value) || 0}"
            >

            <button
                type="button"
                onclick="changeEditorAttributeValue(this,1)"
            >
                +
            </button>

        </div>

        <button
            type="button"
            class="remove-attribute-btn"
            onclick="this.parentElement.remove()"
        >
            ×
        </button>
    `;


    list.appendChild(row);

}


/* =========================================================
   ALTERAR VALOR DO ATRIBUTO NO EDITOR
========================================================= */

function changeEditorAttributeValue(
    button,
    amount
){

    const input =
        button
            .parentElement
            .querySelector(
                ".attribute-value-input"
            );

    if(!input)
        return;


    let value =
        Number(input.value) || 0;


    value += amount;


    input.value = value;

}


/* =========================================================
   LER ATRIBUTOS DO EDITOR
========================================================= */

function getAttributesFromEditor(){

    const attributes = {};


    Object.keys(ATTRIBUTE_CONFIG).forEach(
        key => {

            const list =
                document.getElementById(
                    `attribute-list-${key}`
                );


            attributes[key] = [];


            if(!list)
                return;


            list
                .querySelectorAll(
                    ".attribute-editor-row"
                )
                .forEach(row => {

                    const label =
                        row
                            .querySelector(
                                ".attribute-label"
                            )
                            ?.value
                            .trim() || "";


                    const value =
                        Number(
                            row
                                .querySelector(
                                    ".attribute-value-input"
                                )
                                ?.value
                        ) || 0;


                    attributes[key].push({
                        label,
                        value
                    });

                });

        }
    );


    return attributes;

}

            let resistanceMax =

            let resistance =

                );


            const creature = normalizeCreature({

                    getAttributesFromEditor(),

                notes:
                    document.getElementById(

                            )?.createdAt ||

                        )

            if(currentEditingId){

                            currentEditingId
                    );


                if(index !== -1){

                    creatures[index] =
                        creature;

                creatures.unshift(
                    creature

            saveBestiary();

/* =========================================================
   EXCLUIR
========================================================= */

function deleteCreature(){

    if(!currentEditingId)
        return;


    const creature =
        creatures.find(
            c =>
                c.id ===
                currentEditingId
        );


    if(!creature)
        return;


    const confirmed =
        confirm(
            `Deseja realmente excluir "${creature.name}"?`
        );


    if(!confirmed)
        return;


    creatures =
        creatures.filter(
            c =>
                c.id !==
                currentEditingId
        );


    saveBestiary();

    renderCreatures();

    closeEditor();

}

/* =========================================================
   RENDER
========================================================= */

function renderCreatures(){

    const grid =
        document.getElementById(
            "creatureGrid"
        );


    if(!grid)
        return;


    const search =
        document.getElementById(
            "searchInput"
        )
        ?.value
        .trim()
        .toLowerCase() || "";


    const filtered =
        creatures.filter(
            creature => {

                const matchesSearch =
                    !search ||
                    [
                        creature.name,
                        creature.origin,
                        creature.height,
                        creature.weight
                    ]
                    .some(
                        value =>
                            String(
                                value || ""
                            )
                            .toLowerCase()
                            .includes(search)
                    );


                const matchesFilter =
                    currentFilter ===
                        "todos" ||
                    creature.danger ===
                        currentFilter;


                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">

                <strong>
                    Nenhuma criatura encontrada
                </strong>

                <span>
                    Crie uma criatura para começar o bestiário.
                </span>

            </div>
        `;

        return;

    }


    grid.innerHTML =
        filtered
            .map(
                createCreatureCard
            )
            .join("");

}

/* =========================================================
   STATUS DOS RECURSOS
========================================================= */

function resourceHTML(
    name,
    current,
    max,
    type
){

    const percent =
        percentage(
            current,
            max
        );


    const message =
        resourceMessage(
            percent,
            type
        );


    return `

        <div class="resource-box">

            <div class="resource-header">

                <span class="resource-name">
                    ${name}
                </span>

                <span
                    class="resource-number"
                    style="${resourceTextStyle(
                        percent
                    )}"
                >
                    ${current}/${max}
                </span>

            </div>


            <div class="resource-bar">

                <div
                    class="resource-fill"
                    style="
                        width:${percent}%;
                        ${resourceColorStyle(
                            percent
                        )}
                    "
                ></div>

            </div>


            <div
                class="resource-status"
                style="${resourceTextStyle(
                    percent
                )}"
            >
                ${message}
            </div>

        </div>

    `;

}


function resourceMessage(
    percent,
    type
){

    if(percent >= 90){

        return type === "health"
            ? "Perfeitamente saudável. O corpo está em ótimas condições."
            : "Resistência praticamente intacta. Pronto para continuar.";

    }


    if(percent >= 70){

        return type === "health"
            ? "Boas condições. Pequenos danos não comprometem o combate."
            : "Boa resistência. Ainda possui bastante energia.";

    }


    if(percent >= 50){

        return type === "health"
            ? "Ferimentos moderados. É preciso ter cuidado."
            : "A resistência começa a mostrar sinais de desgaste.";

    }


    if(percent >= 30){

        return type === "health"
            ? "Estado preocupante. Os ferimentos já são significativos."
            : "Resistência baixa. O corpo começa a perder desempenho.";

    }


    if(percent > 0){

        return type === "health"
            ? "ESTADO CRÍTICO. A vida está perigosamente baixa."
            : "ESTADO CRÍTICO. A resistência está quase esgotada.";

    }


    return type === "health"
        ? "VIDA ESGOTADA."
        : "RESISTÊNCIA ESGOTADA.";

}

/* =========================================================
   PORCENTAGEM
========================================================= */

function percentage(
    value,
    max
){

    if(!max || max <= 0)
        return 0;


    return Math.round(
        clamp(
            (Number(value) / Number(max)) * 100,
            0,
            100
        )
    );

}

/* =========================================================

========================================================= */

function exportBestiary(){

    const data = {

        version:3,

        exportedAt:
            new Date().toISOString(),

        creatures

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "nexus-bestiario.json";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   IMPORTAR BESTIÁRIO
========================================================= */

function importBestiary(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const parsed =
                    JSON.parse(
                        reader.result
                    );


                let imported;


                if(Array.isArray(parsed)){

                    imported =
                        parsed;

                }else if(
                    parsed &&
                    Array.isArray(
                        parsed.creatures
                    )
                ){

                    imported =
                        parsed.creatures;

                }else{

                    throw new Error(
                        "Arquivo JSON inválido."
                    );

                }


                creatures =
                    imported.map(
                        normalizeCreature
                    );


                saveBestiary();

                renderCreatures();


                alert(
                    `${creatures.length} criatura(s) importada(s) com sucesso!`
                );


            }catch(error){

                console.error(error);

                alert(
                    "Não foi possível importar o arquivo."
                );

            }


            event.target.value = "";

        };


    reader.readAsText(file);

}


/* =========================================================
   UTILITÁRIOS DE SEGURANÇA
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(value);

}

/* =========================================================
   PROTEÇÃO CONTRA ERROS DE IMAGEM MUITO GRANDE
========================================================= */

async function compressImage(
    file,
    maxWidth = 1400,
    maxHeight = 1400,
    quality = 0.82
){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            let width =
                                img.width;

                            let height =
                                img.height;


                            const ratio =
                                Math.min(
                                    maxWidth / width,
                                    maxHeight / height,
                                    1
                                );


                            width =
                                Math.round(
                                    width * ratio
                                );

                            height =
                                Math.round(
                                    height * ratio
                                );


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                )
                            );

                        };


                    img.onerror =
                        () => reject(
                            new Error(
                                "Não foi possível carregar a imagem."
                            )
                        );


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                () => reject(
                    new Error(
                        "Não foi possível ler a imagem."
                    )
                );


            reader.readAsDataURL(file);

        }
    );

}
