<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NEXUS — BESTIÁRIO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap');

:root{
    --roxo:#9b4dff;
    --roxo2:#6d20c9;

    --fundo:#08040d;

    --painel:rgba(15,8,24,.94);
    --painel2:rgba(25,12,40,.96);

    --texto:#eee8f7;
    --muted:#a99eb5;

    --borda:rgba(155,77,255,.35);

    --baixo:#48d17b;
    --moderado:#ffd447;
    --alto:#ff8b35;
    --extremo:#ff3e5e;
    --desconhecido:#a56cff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:
        linear-gradient(
            rgba(8,4,13,.72),
            rgba(8,4,13,.92)
        ),
        url("fundo.gif")
        center / cover fixed;

    color:var(--texto);

    font-family:Georgia,serif;
}

/* =====================================================
   LOGIN
===================================================== */

#authScreen{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(8,4,13,.68),
            rgba(8,4,13,.94)
        ),
        url("fundo.gif")
        center / cover;

    z-index:9999;
}

.auth-box{

    width:min(430px,92%);

    padding:40px 35px;

    background:rgba(10,5,17,.93);

    border:1px solid var(--borda);

    border-radius:18px;

    box-shadow:
        0 0 30px rgba(155,77,255,.18),
        inset 0 0 30px rgba(155,77,255,.03);

    backdrop-filter:blur(10px);

    text-align:center;
}

.auth-logo{

    font-family:'Cinzel',serif;

    font-size:42px;

    font-weight:600;

    letter-spacing:8px;

    color:white;

    text-shadow:
        0 0 10px var(--roxo),
        0 0 25px var(--roxo),
        0 0 45px rgba(155,77,255,.4);

    margin-bottom:8px;
}

.auth-sub{

    color:var(--muted);

    margin-bottom:30px;

    font-size:14px;
}

.auth-box input{

    width:100%;

    padding:14px 15px;

    margin-bottom:12px;

    border-radius:10px;

    border:1px solid rgba(155,77,255,.3);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.auth-box input:focus{

    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.25);
}

.auth-buttons{

    display:flex;

    gap:10px;

    margin-top:8px;
}

.auth-buttons button{
    flex:1;
}

.btn{

    padding:12px 18px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--roxo2),
            var(--roxo)
        );

    color:white;

    box-shadow:
        0 0 15px rgba(155,77,255,.2);
}

.btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(155,77,255,.45);
}

.btn.secondary{

    background:rgba(255,255,255,.07);
}

.auth-message{

    min-height:20px;

    margin-top:15px;

    color:#ff7389;

    font-size:13px;
}

/* =====================================================
   APP
===================================================== */

#app{

    display:none;

    min-height:100vh;
}

header{

    position:sticky;

    top:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:14px 28px;

    background:rgba(7,3,11,.9);

    border-bottom:1px solid var(--borda);

    backdrop-filter:blur(12px);
}

.logo{

    font-family:'Cinzel',serif;

    margin-top:4px;

    font-size:30px;

    font-weight:600;

    letter-spacing:7px;

    color:white;

    text-shadow:
        0 0 15px rgba(155,77,255,.8),
        0 0 30px rgba(155,77,255,.35);
}

.header-right{

    display:flex;

    align-items:center;

    gap:10px;
}

.profile-button{

    display:flex;

    align-items:center;

    gap:9px;

    padding:6px 10px;

    border-radius:10px;

    background:rgba(255,255,255,.05);

    color:white;

    border:1px solid rgba(255,255,255,.08);
}

.profile-button:hover{

    border-color:rgba(155,77,255,.5);

    background:rgba(155,77,255,.1);
}

.header-avatar{

    width:32px;
    height:32px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid rgba(155,77,255,.5);

    background:#160c20;
}

.header-avatar-placeholder{

    width:32px;
    height:32px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.15);

    border:1px solid rgba(155,77,255,.4);

    font-size:15px;
}

.user-name-header{

    max-width:150px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:13px;
}

.user-email{

    color:var(--muted);

    font-size:12px;
}

.logout{

    padding:8px 12px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:#ddd;

    border:1px solid rgba(255,255,255,.08);
}

.logout:hover{

    background:rgba(255,255,255,.12);
}

/* =====================================================
   CONTEÚDO
===================================================== */

.container{

    width:min(1400px,94%);

    margin:30px auto 60px;
}

.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.title-area h1{

    font-family:'Cinzel',serif;

    font-size:25px;

    letter-spacing:2px;

    color:white;
}

.title-area p{

    color:var(--muted);

    font-size:14px;

    margin-top:5px;
}

.add-btn{

    padding:13px 20px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--roxo2),
            var(--roxo)
        );

    color:white;

    box-shadow:
        0 0 20px rgba(155,77,255,.25);
}

.add-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(155,77,255,.45);
}

/* =====================================================
   FILTROS
===================================================== */

.filters{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:25px;
}

.filter{

    padding:8px 13px;

    border-radius:20px;

    background:rgba(255,255,255,.05);

    color:#cfc5d8;

    border:1px solid rgba(255,255,255,.07);

    font-size:13px;
}

.filter:hover,
.filter.active{

    background:rgba(155,77,255,.18);

    color:white;

    border-color:rgba(155,77,255,.5);
}

/* =====================================================
   BUSCA
===================================================== */

.search-box{

    width:100%;

    margin-bottom:20px;
}

.search-box input{

    width:100%;

    padding:13px 15px;

    border-radius:10px;

    border:1px solid rgba(155,77,255,.25);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.search-box input:focus{

    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.18);
}

/* =====================================================
   GRID
===================================================== */

.grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(270px,1fr));

    gap:20px;
}

.card{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,12,40,.95),
            rgba(9,5,14,.96)
        );

    border:1px solid rgba(155,77,255,.22);

    border-radius:16px;

    min-height:360px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.card:hover{

    transform:translateY(-5px);

    border-color:
        rgba(155,77,255,.65);

    box-shadow:
        0 15px 45px rgba(155,77,255,.18);
}

.card-image{

    height:170px;

    background:
        radial-gradient(
            circle at center,
            rgba(155,77,255,.18),
            transparent 70%
        );

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.card-image img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.no-image{

    font-family:'Cinzel',serif;

    color:#8c7a9b;

    font-size:12px;

    letter-spacing:2px;
}

.card-content{

    padding:16px;
}

.card-name{

    font-family:'Cinzel',serif;

    font-size:19px;

    font-weight:700;

    margin-bottom:7px;

    color:white;
}

.card-info{

    color:var(--muted);

    font-size:13px;

    line-height:1.6;
}

.card-footer{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-top:13px;
}

.badge{

    padding:5px 9px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

    text-transform:uppercase;
}

.badge.baixo{

    background:rgba(72,209,123,.12);

    color:var(--baixo);
}

.badge.moderado{

    background:rgba(255,212,71,.12);

    color:var(--moderado);
}

.badge.alto{

    background:rgba(255,139,53,.12);

    color:var(--alto);
}

.badge.extremo{

    background:rgba(255,62,94,.12);

    color:var(--extremo);
}

.badge.desconhecido{

    background:rgba(165,108,255,.12);

    color:var(--desconhecido);
}

.public-label{

    font-size:11px;

    color:#8f83a0;
}

.card-author{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:13px;

    padding-top:10px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#aaa0b3;

    font-size:11px;
}

.card-author img{

    width:25px;
    height:25px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid rgba(155,77,255,.35);
}

.card-author-placeholder{

    width:25px;
    height:25px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.13);

    border:1px solid rgba(155,77,255,.3);

    font-size:11px;
}

/* =====================================================
   MODAIS
===================================================== */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(8px);

    z-index:5000;
}

.modal.show{

    display:flex;
}

.modal-box{

    width:min(900px,100%);

    max-height:92vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            rgba(24,11,38,.98),
            rgba(8,4,13,.98)
        );

    border:1px solid var(--borda);

    border-radius:18px;

    box-shadow:
        0 0 50px rgba(155,77,255,.2);

    padding:25px;
}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h2{

    font-family:'Cinzel',serif;

    font-size:23px;

    letter-spacing:1px;
}

.close{

    width:35px;
    height:35px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:18px;
}

.close:hover{

    background:rgba(255,255,255,.12);
}

/* =====================================================
   FORMULÁRIO
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;
}

.field{

    display:flex;

    flex-direction:column;

    gap:6px;
}

.field.full{

    grid-column:1/-1;
}

.field label{

    font-size:12px;

    color:#b9aec3;
}

.field input,
.field textarea,
.field select{

    width:100%;

    padding:11px 12px;

    border-radius:9px;

    border:1px solid rgba(155,77,255,.25);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.field textarea{

    min-height:90px;

    resize:vertical;
}

.field select option{

    background:#150b20;

    color:white;
}

.field input:focus,
.field textarea:focus,
.field select:focus{

    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.18);
}

.field input[type="file"]{

    padding:9px;

    cursor:pointer;
}

.field input[type="file"]::file-selector-button{

    padding:7px 10px;

    margin-right:8px;

    border:0;

    border-radius:6px;

    background:var(--roxo2);

    color:white;

    cursor:pointer;

    font-family:Georgia,serif;
}

.image-preview{

    width:100%;

    height:180px;

    margin-top:5px;

    border-radius:10px;

    overflow:hidden;

    border:1px solid rgba(155,77,255,.2);

    background:rgba(255,255,255,.025);

    display:none;

    align-items:center;

    justify-content:center;
}

.image-preview.show{

    display:flex;
}

.image-preview img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.remove-image-btn{

    display:none;

    margin-top:5px;

    padding:8px;

    border-radius:8px;

    background:rgba(255,62,94,.1);

    color:#ff7188;

    border:1px solid rgba(255,62,94,.2);
}

.remove-image-btn.show{

    display:block;
}

.section-title{

    grid-column:1/-1;

    margin-top:10px;

    padding-bottom:7px;

    border-bottom:1px solid rgba(155,77,255,.18);

    color:#c8a9e8;

    font-family:'Cinzel',serif;

    font-size:14px;

    letter-spacing:1px;
}

.checkbox-row{

    display:flex;

    align-items:center;

    gap:9px;

    padding:12px;

    border-radius:9px;

    background:rgba(255,255,255,.035);
}

.checkbox-row input{

    accent-color:var(--roxo);
}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:22px;
}

.delete-btn{

    margin-right:auto;

    padding:11px 15px;

    border-radius:9px;

    background:rgba(255,62,94,.12);

    color:#ff6e85;

    border:1px solid rgba(255,62,94,.2);
}

.delete-btn:hover{

    background:rgba(255,62,94,.2);
}

/* =====================================================
   PERFIL
===================================================== */

.profile-box{

    width:min(520px,100%);
}

.profile-avatar-area{

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-bottom:20px;
}

.profile-avatar-preview{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    background:rgba(155,77,255,.1);

    border:2px solid rgba(155,77,255,.5);

    box-shadow:
        0 0 25px rgba(155,77,255,.2);
}

.profile-avatar-placeholder{

    width:120px;
    height:120px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.1);

    border:2px solid rgba(155,77,255,.5);

    font-size:35px;
}

/* =====================================================
   FICHA
===================================================== */

.sheet{

    display:grid;

    grid-template-columns:
        280px 1fr;

    gap:25px;
}

.sheet-image{

    min-height:330px;

    border-radius:14px;

    overflow:hidden;

    border:1px solid rgba(155,77,255,.2);

    background:rgba(255,255,255,.03);
}

.sheet-image img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.sheet-placeholder{

    height:100%;

    min-height:330px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#776980;

    font-family:'Cinzel',serif;

    font-size:12px;

    letter-spacing:2px;
}

.sheet-name{

    font-family:'Cinzel',serif;

    font-size:31px;

    font-weight:700;

    margin-bottom:8px;

    color:white;
}

.sheet-origin{

    color:#a99eb5;

    margin-bottom:18px;
}

.stats{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-bottom:20px;
}

.stat{

    padding:12px;

    border-radius:10px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.05);
}

.stat span{

    display:block;

    color:#91849b;

    font-size:11px;

    margin-bottom:4px;
}

.stat strong{

    color:white;
}

.sheet-section{

    margin-top:18px;
}

.sheet-section h3{

    font-family:'Cinzel',serif;

    color:#c8a9e8;

    font-size:15px;

    margin-bottom:8px;
}

.sheet-section p,
.sheet-section li{

    color:#c3bacb;

    font-size:14px;

    line-height:1.6;
}

.sheet-section ul{

    padding-left:20px;
}

.author-box{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:20px;

    padding:12px;

    border-radius:10px;

    background:rgba(155,77,255,.06);

    border:1px solid rgba(155,77,255,.14);
}

.author-box img{

    width:42px;
    height:42px;

    border-radius:50%;

    object-fit:cover;
}

.author-placeholder{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.15);

    border:1px solid rgba(155,77,255,.3);
}

/* =====================================================
   VIDA / RESISTÊNCIA
===================================================== */

.bar{

    height:9px;

    background:rgba(255,255,255,.08);

    border-radius:20px;

    overflow:hidden;

    margin-top:6px;
}

.bar-fill{

    height:100%;

    background:
        linear-gradient(
            90deg,
            #6d20c9,
            #b66cff
        );

    transition:.3s;
}

/* =====================================================
   MÚSICA
===================================================== */

.music-btn{

    position:fixed;

    right:20px;

    bottom:20px;

    z-index:8000;

    padding:12px 16px;

    border-radius:30px;

    background:rgba(18,8,28,.92);

    color:white;

    border:1px solid rgba(155,77,255,.4);

    box-shadow:
        0 0 20px rgba(155,77,255,.18);

    backdrop-filter:blur(8px);
}

.music-btn:hover{

    border-color:var(--roxo);

    box-shadow:
        0 0 25px rgba(155,77,255,.4);
}

/* =====================================================
   VAZIO
===================================================== */

.empty{

    grid-column:1/-1;

    padding:70px 20px;

    text-align:center;

    color:#8e8199;
}

.empty strong{

    display:block;

    font-family:'Cinzel',serif;

    color:#b9a9c4;

    margin-bottom:8px;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

    header{

        padding:13px 15px;
    }

    .logo{

        font-size:22px;

        letter-spacing:5px;
    }

    .user-email{

        display:none;
    }

    .user-name-header{

        max-width:90px;
    }

    .topbar{

        flex-direction:column;

        align-items:flex-start;
    }

    .form-grid{

        grid-template-columns:1fr;
    }

    .sheet{

        grid-template-columns:1fr;
    }

    .sheet-image{

        height:300px;

        min-height:0;
    }

    .sheet-placeholder{

        min-height:300px;
    }

    .stats{

        grid-template-columns:1fr;
    }

    .auth-box{

        padding:30px 22px;
    }

    .auth-logo{

        font-size:35px;
    }

    .auth-buttons{

        flex-direction:column;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">
            NEXUS
        </div>

        <div class="auth-sub">
            BESTIÁRIO DIGITAL
        </div>

        <input
            id="email"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
        >

        <input
            id="password"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <div class="auth-buttons">

            <button
                class="btn"
                onclick="login()"
            >
                ENTRAR
            </button>

            <button
                class="btn secondary"
                onclick="signup()"
            >
                      CRIAR CONTA
            </button>

        </div>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

    <header>

        <div class="logo">
            NEXUS
        </div>

        <div class="header-right">

            <button
                class="profile-button"
                onclick="openProfile()"
            >

                <div id="headerAvatarContainer">
                    <div class="header-avatar-placeholder">
                        👤
                    </div>
                </div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL = "COLOQUE_SUA_URL_DO_SUPABASE";

const SUPABASE_ANON_KEY =
    "COLOQUE_SUA_ANON_KEY_DO_SUPABASE";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ESTADO
===================================================== */

let currentUser = null;

let currentProfile = null;

let creatures = [];

let currentFilter = "todos";

let currentCreature = null;

let currentCreatureImage = null;

let removeCurrentCreatureImage = false;

let currentProfileImage = null;

let removeCurrentProfileImage = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const authMessage =
    document.getElementById("authMessage");

const searchInput =
    document.getElementById("searchInput");

const creatureGrid =
    document.getElementById("creatureGrid");

const editorModal =
    document.getElementById("editorModal");

const profileModal =
    document.getElementById("profileModal");

const sheetModal =
    document.getElementById("sheetModal");

const creatureImage =
    document.getElementById("creatureImage");

const creatureImagePreview =
    document.getElementById("creatureImagePreview");

const creaturePreviewImg =
    document.getElementById("creaturePreviewImg");

const removeCreatureImageButton =
    document.getElementById("removeCreatureImage");

const profileImage =
    document.getElementById("profileImage");


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        setupImagePreview();

        setupCoreHealth();

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();

        if (
            error ||
            !data ||
            !data.session
        ) {

            showLogin();

            return;
        }

        currentUser =
            data.session.user;

        await initializeApp();

    }
);


/* =====================================================
   MONITORAR LOGIN
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (session) {

            currentUser =
                session.user;

            await initializeApp();

        } else {

            currentUser = null;

            showLogin();

        }

    }
);


/* =====================================================
   MOSTRAR LOGIN
===================================================== */

function showLogin(){

    authScreen.style.display =
        "flex";

    app.style.display =
        "none";

}


/* =====================================================
   MOSTRAR APP
===================================================== */

async function initializeApp(){

    authScreen.style.display =
        "none";

    app.style.display =
        "block";

    await loadProfile();

    await loadCreatures();

    updateHeader();

}


/* =====================================================
   CRIAR CONTA
===================================================== */

async function signup(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    authMessage.textContent = "";

    if (!email || !password){

        authMessage.textContent =
            "Preencha o e-mail e a senha.";

        return;
    }

    if (password.length < 6){

        authMessage.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email,
        password,

        options:{
            data:{
                username:
                    email.split("@")[0]
            }
        }

    });


    if (error){

        authMessage.textContent =
            error.message;

        return;
    }


    if (
        data.user &&
        !data.session
    ){

        authMessage.style.color =
            "#48d17b";

        authMessage.textContent =
            "Conta criada! Verifique seu e-mail para confirmar a conta.";

        return;
    }


    authMessage.style.color =
        "#48d17b";

    authMessage.textContent =
        "Conta criada com sucesso!";

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    authMessage.style.color =
        "#ff7389";

    authMessage.textContent = "";

    if (!email || !password){

        authMessage.textContent =
            "Preencha o e-mail e a senha.";

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email,

        password

    });


    if (error){

        authMessage.textContent =
            "E-mail ou senha incorretos.";

        return;
    }


    currentUser =
        data.user;

    await initializeApp();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    creatures = [];

    currentUser = null;

    currentProfile = null;

    showLogin();

}


/* =====================================================
   PERFIL
===================================================== */

async function loadProfile(){

    if (!currentUser)
        return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (error){

        console.error(
            "Erro ao carregar perfil:",
            error
        );

        return;
    }


    if (!data){

        const defaultName =
            currentUser.user_metadata?.username ||
            currentUser.email?.split("@")[0] ||
            "Usuário";


        const {
            data:createdProfile,
            error:createError
        } =
        await supabaseClient
            .from("profiles")
            .insert({

                id:
                    currentUser.id,

                username:
                    defaultName,

                avatar_url:
                    null

            })
            .select()
            .single();


        if (!createError){

            currentProfile =
                createdProfile;

        } else {

            console.error(
                "Erro ao criar perfil:",
                createError
            );

        }

    } else {

        currentProfile =
            data;

    }

}


/* =====================================================
   ATUALIZAR HEADER
===================================================== */

function updateHeader(){

    if (!currentUser)
        return;


    const name =
        currentProfile?.username ||
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "Usuário";


    document.getElementById(
        "headerUserName"
    ).textContent = name;


    document.getElementById(
        "headerUserEmail"
    ).textContent =
        currentUser.email || "—";


    const container =
        document.getElementById(
            "headerAvatarContainer"
        );


    if (
        currentProfile &&
        currentProfile.avatar_url
    ){

        container.innerHTML = `

            <img
                class="header-avatar"
                src="${escapeAttribute(
                    currentProfile.avatar_url
                )}"
                alt="Avatar"
            >

        `;

    } else {

        container.innerHTML = `

            <div class="header-avatar-placeholder">
                👤
            </div>

        `;

    }

}


/* =====================================================
   ABRIR PERFIL
===================================================== */

function openProfile(){

    if (!currentUser)
        return;


    document.getElementById(
        "profileName"
    ).value =
        currentProfile?.username || "";


    document.getElementById(
        "profileEmail"
    ).value =
        currentUser.email || "";


    currentProfileImage = null;

    removeCurrentProfileImage = false;

    profileImage.value = "";


    renderProfileAvatar();


    profileModal.classList.add("show");

}


/* =====================================================
   FECHAR PERFIL
===================================================== */

function closeProfile(){

    profileModal.classList.remove(
        "show"
    );

}


/* =====================================================
   RENDERIZAR AVATAR DO PERFIL
===================================================== */

function renderProfileAvatar(){

    const container =
        document.getElementById(
            "profileAvatarContainer"
        );


    const url =
        cu    const url =
        currentProfileImage ||
        (
            !removeCurrentProfileImage
                ? currentProfile?.avatar_url
                : null
        );


    if (url){

        container.innerHTML = `

            <img
                class="profile-avatar-preview"
                src="${escapeAttribute(url)}"
                alt="Avatar"
            >

        `;

    } else {

        container.innerHTML = `

            <div class="profile-avatar-placeholder">
                👤
            </div>

        `;

    }

}


/* =====================================================
   PRÉ-VISUALIZAÇÃO DA FOTO DE PERFIL
===================================================== */

profileImage.addEventListener(
    "change",
    () => {

        const file =
            profileImage.files?.[0];

        if (!file)
            return;

        if (!file.type.startsWith("image/")){

            profileImage.value = "";

            document.getElementById(
                "profileMessage"
            ).textContent =
                "Selecione uma imagem válida.";

            return;
        }

        const reader =
            new FileReader();

        reader.onload = event => {

            currentProfileImage =
                event.target.result;

            removeCurrentProfileImage =
                false;

            renderProfileAvatar();

        };

        reader.readAsDataURL(file);

    }
);


/* =====================================================
   SALVAR PERFIL
===================================================== */

async function saveProfile(){

    if (!currentUser)
        return;


    const message =
        document.getElementById(
            "profileMessage"
        );

    message.style.color =
        "#ff7389";

    message.textContent = "";


    const username =
        document.getElementById(
            "profileName"
        ).value.trim();


    if (!username){

        message.textContent =
            "Digite um nome de usuário.";

        return;
    }


    let avatarUrl =
        currentProfile?.avatar_url || null;


    /*
     * Se uma nova imagem foi escolhida,
     * transforma em Data URL.
     *
     * Isso permite que o sistema funcione
     * mesmo sem precisar criar um Storage
     * separado no Supabase.
     */

    if (currentProfileImage){

        avatarUrl =
            currentProfileImage;

    }


    if (removeCurrentProfileImage){

        avatarUrl = null;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .upsert({

            id:
                currentUser.id,

            username,

            avatar_url:
                avatarUrl

        })
        .select()
        .single();


    if (error){

        console.error(
            "Erro ao salvar perfil:",
            error
        );

        message.textContent =
            "Não foi possível salvar o perfil.";

        return;
    }


    currentProfile =
        data;


    currentProfileImage =
        null;

    removeCurrentProfileImage =
        false;


    updateHeader();


    message.style.color =
        "#48d17b";

    message.textContent =
        "Perfil salvo com sucesso!";


    setTimeout(
        () => {

            closeProfile();

        },
        700
    );

}


/* =====================================================
   CRIATURAS
===================================================== */

async function loadCreatures(){

    if (!currentUser)
        return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("creatures")
        .select("*")
        .or(
            `public.eq.true,user_id.eq.${currentUser.id}`
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if (error){

        console.error(
            "Erro ao carregar criaturas:",
            error
        );

        creatureGrid.innerHTML = `

            <div class="empty">

                <strong>
                    Não foi possível carregar o bestiário.
                </strong>

                Verifique as configurações do Supabase.

            </div>

        `;

        return;
    }


    creatures =
        data || [];


    renderCreatures();

}


/* =====================================================
   FILTRO
===================================================== */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(".filter")
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    if (button){

        button.classList.add(
            "active"
        );

    }


    renderCreatures();

}


/* =====================================================
   RENDERIZAR CRIATURAS
===================================================== */

function renderCreatures(){

    if (!creatureGrid)
        return;


    const search =
        searchInput
            ?.value
            ?.trim()
            .toLowerCase() || "";


    const filtered =
        creatures.filter(
            creature => {

                const danger =
                    String(
                        creature.danger || ""
                    ).toLowerCase();


                const matchesFilter =
                    currentFilter === "todos" ||
                    danger === currentFilter;


                const text = [

                    creature.name,

                    creature.origin,

                    creature.organization,

                    creature.role,

                    creature.nexo_name

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                return (
                    matchesFilter &&
                    matchesSearch
                );

            }
        );


    if (!filtered.length){

        creatureGrid.innerHTML = `

            <div class="empty">

                <strong>
                    Nenhum registro encontrado.
                </strong>

                Tente mudar os filtros
                ou criar uma nova criatura.

            </div>

        `;

        return;
    }


    creatureGrid.innerHTML =
        filtered
            .map(
                creature =>
                    creatureCard(creature)
            )
            .join("");

}

/* =====================================================
   PRÉ-VISUALIZAÇÃO DA IMAGEM
===================================================== */

function setupImagePreview(){

    if (!creatureImage)
        return;


    creatureImage.addEventListener(
        "change",
        () => {

            const file =
                creatureImage.files?.[0];


            if (!file)
                return;


            if (!file.type.startsWith("image/")){

                creatureImage.value = "";

                currentCreatureImage =
                    null;

                document.getElementById(
                    "authMessage"
                ).textContent =
                    "Selecione uma imagem válida.";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    currentCreatureImage =
                        event.target.result;

                    removeCurrentCreatureImage =
                        false;

                    renderCreatureImagePreview();

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   RENDERIZAR PREVIEW DA CRIATURA
===================================================== */

function renderCreatureImagePreview(
    existingUrl = null
){

    if (!creatureImagePreview)
        return;


    const url =
        currentCreatureImage ||
        (
            !removeCurrentCreatureImage
                ? existingUrl

    if (url){

        creaturePreviewImg.src =

        creatureImagePreview.classList.add(

        creaturePreviewImg.src = "";

        creatureImagePreview.classList.remove(
            "show"
        );

        removeCreatureImageButton.classList.remove(
            "show"
        );

    }

}

/* =====================================================
   NÚCLEO
===================================================== */

function setupCoreHealth(){

    const input =
        document.getElementById(
            "creatureCoreHealth"
        );


    if (!input)
        return;


    input.addEventListener(
        "input",
        updateCoreHealthMessage
    );

}


/* =====================================================
   ATUALIZAR MENSAGEM DO NÚCLEO
===================================================== */

function updateCoreHealthMessage(){

    const input =
        document.getElementById(
            "creatureCoreHealth"
        );

    const message =
        document.getElementById(
            "coreHealthMessage"
        );


    if (!input || !message)
        return;


    const value =
        clampNumber(
            input.value,
            0,
            100,
            100
        );


    message.textContent =
        getCoreHealthMessage(value);


    if (value >= 70){

        message.style.color =
            "#48d17b";

    } else if (value >= 50){

        message.style.color =
            "#ffd447";

    } else if (value >= 30){

        message.style.color =
            "#ff8b35";

    } else if (value > 0){

        message.style.color =
            "#ff3e5e";

    } else {

        message.style.color =
            "#ff3e5e";

    }

}


/* =====================================================
   MENSAGENS DA VIDA DO NÚCLEO
===================================================== */

function getCoreHealthMessage(
    value
){

    value =
        Number(value);


    if (value >= 70){

        return "Ótimas condições, seu núcleo está perfeito!";

    }


    if (value >= 50){

        return "Condições estáveis, mas o núcleo já apresenta sinais de desgaste.";

    }


    if (value >= 30){

        return "Atenção! O núcleo está danificado e precisa de cuidados.";

    }


    if (value > 0){

        return "PERIGO! O núcleo está em estado crítico.";

    }


    return "NÚCLEO DESTRUÍDO.";

}

            document.getElementById(
                "creatureNexoName"
            ).value.trim() || null,

        nexo_state:
            document.getElementById(
                "creatureNexoState"
            ).value,

        nexo_level:
            Number(
                document.getElementById(
                    "creatureNexoLevel"
                ).value
            ) || 1,

        nexo_control:
            Number(
                document.getElementById(
                    "creatureNexoControl"
                ).value
            ) || 0,

        core_health:
            coreHealth,

        core_resistance:
            coreResistance,

        current_level:
            Number(
                document.getElementById(
                    "creatureCurrentLevel"
                ).value
            ) || 1,

        xp:
            Number(
                document.getElementById(
                    "creatureXP"
                ).value
            ) || 0,

        description:
            document.getElementById(
                "creatureDescription"
            ).value.trim() || null,

        abilities:
            document.getElementById(
                "creatureAbilities"
            ).value.trim() || null,

        history:
            document.getElementById(
                "creatureHistory"
            ).value.trim() || null,

        public:
            document.getElementById(
                "creaturePublic"
            ).checked

    };


    let result;


    if (id){

        result =
            await supabaseClient
                .from("creatures")
                .update(
                    creatureData
                )
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .select()
                .single();

    } else {

        result =
            await supabaseClient
                .from("creatures")
                .insert({

                    ...creatureData,

                    user_id:
                        currentUser.id

                })
                .select()
                .single();

    }


    const {
        data,
        error
    } = result;


    if (error){

        console.error(
            "Erro ao salvar criatura:",
            error
        );


        alert(
            "Não foi possível salvar a criatura.\n\n" +
            error.message
        );

        return;
    }


    if (id){

        const index =
            creatures.findIndex(
                creature =>
                    String(creature.id) ===
                    String(id)
            );


        if (index !== -1){

            creatures[index] =
                data;

        }

    } else {

        creatures.unshift(
            data
        );

    }


    currentCreatureImage =
        null;

    removeCurrentCreatureImage =
        false;


    closeEditor();

    renderCreatures();

    alert(
        id
            ? "Criatura atualizada com sucesso!"
            : "Criatura criada com sucesso!"
    );

}


/* =====================================================
   EXCLUIR CRIATURA
===================================================== */

async function deleteCreature(){

    const id =
        document.getElementById(
            "creatureId"
        ).value.trim();


    if (!id || !currentUser)
        return;


    const creature =
        creatures.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!creature)
        return;


    const confirmed =
        confirm(
            `Tem certeza que deseja excluir "${creature.name || "esta criatura"}"?\n\nEssa ação não pode ser desfeita.`
        );


    if (!confirmed)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("creatures")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if (error){

        console.error(
            "Erro ao excluir criatura:",
            error
        );


        alert(
            "Não foi possível excluir a criatura.\n\n" +
            error.message
        );

        return;
    }


    creatures =
        creatures.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    closeEditor();

    renderCreatures();


    alert(
        "Criatura excluída com sucesso!"
    );

}


/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function capitalize(
    text
){

    if (!text)
        return "";


    return String(text)
        .charAt(0)
        .toUpperCase() +
        String(text)
            .slice(1);

}


function clampNumber(
    value,
    min,
    max,
    fallback
){

    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ){

        return fallback;

    }


    return Math.min(
        max,
        Math.max(
            min,
            number
        )
    );

}


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}


function formatText(
    text
){

    return escapeHTML(
        text
    )
    .replace(
        /\r?\n/g,
        "<br>"
    );

}

/* =====================================================
   MÚSICA
===================================================== */

let musicPlaying =
    false;


async function toggleMusic(){

    const music =
        document.getElementById(
            "backgroundMusic"
        );


    const button =
        document.getElementById(
            "musicButton"
        );


    if (!music)
        return;


    try {

        if (music.paused){

            await music.play();

            musicPlaying =
                true;

            button.textContent =
                "♫ Música: ON";

        } else {

            music.pause();

            musicPlaying =
                false;

            button.textContent =
                "♫ Música: OFF";

        }

    } catch(error){

        console.error(
            "Erro ao reproduzir música:",
            error
        );

        button.textContent =
            "♫ Toque para ouvir";

    }

}
