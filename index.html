<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS — BESTIÁRIO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap');

:root{
    --roxo:#9b4dff;
    --roxo2:#6d20c9;
    --fundo:#08040d;

    --painel:rgba(15,8,24,.94);
    --painel2:rgba(25,12,40,.96);

    --texto:#eee8f7;
    --muted:#a99eb5;

    --borda:rgba(155,77,255,.35);

    --baixo:#48d17b;
    --moderado:#ffd447;
    --alto:#ff8b35;
    --extremo:#ff3e5e;
    --desconhecido:#a56cff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:
        linear-gradient(
            rgba(8,4,13,.72),
            rgba(8,4,13,.92)
        ),
        url("https://cdn.discordapp.com/attachments/1540826842020192348/1544493761202094203/844f7e76c6e1eeb8266be6b17362b385.gif?ex=6a995e27&is=6a980ca7&hm=dc167678a10c5de168b4e6e7e941457fc03cfa6d71aa4553068d4d608264452d&")
        center / cover fixed;

    color:var(--texto);

    font-family:Georgia,serif;
}

/* =====================================================
   BOTÕES
===================================================== */

button{
    border:0;
    cursor:pointer;
    font-family:Georgia,serif;
}

.btn{
    padding:12px 18px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--roxo2),
            var(--roxo)
        );

    color:white;

    box-shadow:
        0 0 15px rgba(155,77,255,.2);

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(155,77,255,.45);
}

.btn.secondary{
    background:rgba(255,255,255,.07);
}

/* =====================================================
   LOGIN
===================================================== */

#authScreen{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(8,4,13,.68),
            rgba(8,4,13,.94)
        ),
        url("https://cdn.discordapp.com/attachments/1540826842020192348/1544493761202094203/844f7e76c6e1eeb8266be6b17362b385.gif?ex=6a995e27&is=6a980ca7&hm=dc167678a10c5de168b4e6e7e941457fc03cfa6d71aa4553068d4d608264452d&")
        center / cover;

    z-index:9999;
}

.auth-box{
    width:min(430px,92%);

    padding:40px 35px;

    background:rgba(10,5,17,.93);

    border:1px solid var(--borda);

    border-radius:18px;

    box-shadow:
        0 0 30px rgba(155,77,255,.18),
        inset 0 0 30px rgba(155,77,255,.03);

    backdrop-filter:blur(10px);

    text-align:center;
}

.auth-logo{
    font-family:'Cinzel',serif;

    font-size:42px;

    font-weight:600;

    letter-spacing:8px;

    color:#fff;

    text-shadow:
        0 0 10px var(--roxo),
        0 0 25px var(--roxo),
        0 0 45px rgba(155,77,255,.4);

    margin-bottom:8px;
}

.auth-sub{
    color:var(--muted);

    margin-bottom:30px;

    font-size:14px;
}

.auth-box input{
    width:100%;

    padding:14px 15px;

    margin-bottom:12px;

    border-radius:10px;

    border:1px solid rgba(155,77,255,.3);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.auth-box input:focus{
    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.25);
}

.auth-buttons{
    display:flex;
    gap:10px;
    margin-top:8px;
}

.auth-buttons button{
    flex:1;
}

.auth-message{
    min-height:20px;

    margin-top:15px;

    color:#ff7389;

    font-size:13px;
}

/* =====================================================
   APP
===================================================== */

#app{
    display:none;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 28px;

    background:rgba(7,3,11,.9);

    border-bottom:1px solid var(--borda);

    backdrop-filter:blur(12px);
}

.logo{
    font-family:'Cinzel',serif;

    margin-top:4px;

    font-size:30px;

    font-weight:600;

    letter-spacing:7px;

    color:#fff;

    text-shadow:
        0 0 15px rgba(155,77,255,.8),
        0 0 30px rgba(155,77,255,.35);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-button{
    display:flex;
    align-items:center;
    gap:9px;

    padding:6px 10px;

    border-radius:10px;

    background:rgba(255,255,255,.05);

    color:white;

    border:1px solid rgba(255,255,255,.08);
}

.profile-button:hover{
    border-color:rgba(155,77,255,.5);
    background:rgba(155,77,255,.1);
}

.header-avatar{
    width:32px;
    height:32px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid rgba(155,77,255,.5);

    background:#160c20;
}

.header-avatar-placeholder{
    width:32px;
    height:32px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.15);

    border:1px solid rgba(155,77,255,.4);

    font-size:15px;
}

.user-name-header{
    max-width:150px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:13px;
}

.user-email{
    color:var(--muted);
    font-size:12px;
}

.logout{
    padding:8px 12px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:#ddd;

    border:1px solid rgba(255,255,255,.08);
}

.logout:hover{
    background:rgba(255,255,255,.12);
}

/* =====================================================
   CONTEÚDO
===================================================== */

.container{
    width:min(1400px,94%);

    margin:30px auto 60px;
}

.topbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.title-area h1{
    font-family:'Cinzel',serif;

    font-size:25px;

    letter-spacing:2px;

    color:#fff;
}

.title-area p{
    color:var(--muted);

    font-size:14px;

    margin-top:5px;
}

.add-btn{
    padding:13px 20px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--roxo2),
            var(--roxo)
        );

    color:white;

    box-shadow:
        0 0 20px rgba(155,77,255,.25);

    transition:.2s;
}

.add-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(155,77,255,.45);
}

/* =====================================================
   BUSCA
===================================================== */

.search-box{
    width:100%;
    margin-bottom:20px;
}

.search-box input{
    width:100%;

    padding:13px 15px;

    border-radius:10px;

    border:1px solid rgba(155,77,255,.25);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.search-box input:focus{
    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.18);
}

/* =====================================================
   FILTROS
===================================================== */

.filters{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-bottom:25px;
}

.filter{
    padding:8px 13px;

    border-radius:20px;

    background:rgba(255,255,255,.05);

    color:#cfc5d8;

    border:1px solid rgba(255,255,255,.07);

    font-size:13px;

    transition:.2s;
}

.filter:hover,
.filter.active{
    background:rgba(155,77,255,.18);

    color:white;

    border-color:rgba(155,77,255,.5);
}

/* =====================================================
   GRID
===================================================== */

.grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(270px,1fr));

    gap:20px;
}

.card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,12,40,.95),
            rgba(9,5,14,.96)
        );

    border:1px solid rgba(155,77,255,.22);

    border-radius:16px;

    min-height:360px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(155,77,255,.65);

    box-shadow:
        0 15px 45px rgba(155,77,255,.18);
}

.card-image{
    height:170px;

    background:
        radial-gradient(
            circle at center,
            rgba(155,77,255,.18),
            transparent 70%
        );

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.no-image{
    font-family:'Cinzel',serif;

    color:#8c7a9b;

    font-size:12px;

    letter-spacing:2px;
}

.card-content{
    padding:16px;
}

.card-name{
    font-family:'Cinzel',serif;

    font-size:19px;

    font-weight:700;

    margin-bottom:7px;

    color:white;
}

.card-info{
    color:var(--muted);

    font-size:13px;

    line-height:1.6;
}

.card-footer{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-top:13px;
}

.badge{
    padding:5px 9px;

    border-radius:6px;

    font-size:11px;

    font-weight:bold;

    text-transform:uppercase;
}

.badge.baixo{
    background:rgba(72,209,123,.12);
    color:var(--baixo);
}

.badge.moderado{
    background:rgba(255,212,71,.12);
    color:var(--moderado);
}

.badge.alto{
    background:rgba(255,139,53,.12);
    color:var(--alto);
}

.badge.extremo{
    background:rgba(255,62,94,.12);
    color:var(--extremo);
}

.badge.desconhecido{
    background:rgba(165,108,255,.12);
    color:var(--desconhecido);
}

.public-label{
    font-size:11px;
    color:#8f83a0;
}

.card-author{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:13px;

    padding-top:10px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#aaa0b3;

    font-size:11px;
}

.card-author img{
    width:25px;
    height:25px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid rgba(155,77,255,.35);
}

.card-author-placeholder{
    width:25px;
    height:25px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.13);

    border:1px solid rgba(155,77,255,.3);

    font-size:11px;
}

/* =====================================================
   MODAIS
===================================================== */

.modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(8px);

    z-index:5000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);

    max-height:92vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            rgba(24,11,38,.98),
            rgba(8,4,13,.98)
        );

    border:1px solid var(--borda);

    border-radius:18px;

    box-shadow:
        0 0 50px rgba(155,77,255,.2);

    padding:25px;
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h2{
    font-family:'Cinzel',serif;

    font-size:23px;

    letter-spacing:1px;
}

.close{
    width:35px;
    height:35px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:18px;
}

.close:hover{
    background:rgba(255,255,255,.12);
}

/* =====================================================
   FORMULÁRIO
===================================================== */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;
}

.field{
    display:flex;

    flex-direction:column;

    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:12px;
    color:#b9aec3;
}

.field input,
.field textarea,
.field select{
    width:100%;

    padding:11px 12px;

    border-radius:9px;

    border:1px solid rgba(155,77,255,.25);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field select option{
    background:#150b20;
    color:white;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.18);
}

.field input[type="file"]{
    padding:9px;
    cursor:pointer;
}

.field input[type="file"]::file-selector-button{
    padding:7px 10px;

    margin-right:8px;

    border:0;

    border-radius:6px;

    background:var(--roxo2);

    color:white;

    cursor:pointer;

    font-family:Georgia,serif;
}

.image-preview{
    width:100%;

    height:180px;

    margin-top:5px;

    border-radius:10px;

    overflow:hidden;

    border:1px solid rgba(155,77,255,.2);

    background:rgba(255,255,255,.025);

    display:none;

    align-items:center;

    justify-content:center;
}

.image-preview.show{
    display:flex;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.remove-image-btn{
    display:none;

    margin-top:5px;

    padding:8px;

    border-radius:8px;

    background:rgba(255,62,94,.1);

    color:#ff7188;

    border:1px solid rgba(255,62,94,.2);
}

.remove-image-btn.show{
    display:block;
}

.section-title{
    grid-column:1/-1;

    margin-top:10px;

    padding-bottom:7px;

    border-bottom:1px solid rgba(155,77,255,.18);

    color:#c8a9e8;

    font-family:'Cinzel',serif;

    font-size:14px;

    letter-spacing:1px;
}

.checkbox-row{
    display:flex;

    align-items:center;

    gap:9px;

    padding:12px;

    border-radius:9px;

    background:rgba(255,255,255,.035);
}

.checkbox-row input{
    accent-color:var(--roxo);
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:22px;
}

.delete-btn{
    margin-right:auto;

    padding:11px 15px;

    border-radius:9px;

    background:rgba(255,62,94,.12);

    color:#ff6e85;

    border:1px solid rgba(255,62,94,.2);

    cursor:pointer;
}

.delete-btn:hover{
    background:rgba(255,62,94,.2);
}

/* =====================================================
   PERFIL
===================================================== */

.profile-box{
    width:min(520px,100%);
}

.profile-avatar-area{
    display:flex;

    flex-direction:column;

    align-items:center;

    margin-bottom:20px;
}

.profile-avatar-preview{
    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    background:rgba(155,77,255,.1);

    border:2px solid rgba(155,77,255,.5);

    box-shadow:
        0 0 25px rgba(155,77,255,.2);
}

.profile-avatar-placeholder{
    width:120px;
    height:120px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.1);

    border:2px solid rgba(155,77,255,.5);

    font-size:35px;
}

/* =====================================================
   FICHA
===================================================== */

.sheet{
    display:grid;

    grid-template-columns:
        280px 1fr;

    gap:25px;
}

.sheet-image{
    min-height:330px;

    border-radius:14px;

    overflow:hidden;

    border:1px solid rgba(155,77,255,.2);

    background:rgba(255,255,255,.03);
}

.sheet-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.sheet-placeholder{
    height:100%;

    min-height:330px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#776980;

    font-family:'Cinzel',serif;

    font-size:12px;

    letter-spacing:2px;
}

.sheet-name{
    font-family:'Cinzel',serif;

    font-size:31px;

    font-weight:700;

    margin-bottom:8px;

    color:white;
}

.sheet-origin{
    color:#a99eb5;
    margin-bottom:18px;
}

.stats{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-bottom:20px;
}

.stat{
    padding:12px;

    border-radius:10px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.05);
}

.stat span{
    display:block;

    color:#91849b;

    font-size:11px;

    margin-bottom:4px;
}

.stat strong{
    color:white;
}

.sheet-section{
    margin-top:18px;
}

.sheet-section h3{
    font-family:'Cinzel',serif;

    color:#c8a9e8;

    font-size:15px;

    margin-bottom:8px;
}

.sheet-section p,
.sheet-section li{
    color:#c3bacb;

    font-size:14px;

    line-height:1.6;
}

.sheet-section ul{
    padding-left:20px;
}

.author-box{
    display:flex;

    align-items:center;

    gap:10px;

    margin-top:20px;

    padding:12px;

    border-radius:10px;

    background:rgba(155,77,255,.06);

    border:1px solid rgba(155,77,255,.14);
}

.author-box img{
    width:42px;
    height:42px;

    border-radius:50%;

    object-fit:cover;
}

.author-placeholder{
    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(155,77,255,.15);

    border:1px solid rgba(155,77,255,.3);
}

/* =====================================================
   BARRAS
===================================================== */

.bar{
    height:9px;

    background:rgba(255,255,255,.08);

    border-radius:20px;

    overflow:hidden;

    margin-top:6px;
}

.bar-fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #6d20c9,
            #b66cff
        );

    transition:.3s;
}

/* =====================================================
   MÚSICA
===================================================== */

.music-btn{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:8000;

    padding:12px 16px;

    border-radius:30px;

    background:rgba(18,8,28,.92);

    color:white;

    border:1px solid rgba(155,77,255,.4);

    box-shadow:
        0 0 20px rgba(155,77,255,.18);

    backdrop-filter:blur(8px);

    cursor:pointer;

    transition:.2s;
}

.music-btn:hover{
    border-color:var(--roxo);

    box-shadow:
        0 0 25px rgba(155,77,255,.4);
}

/* =====================================================
   VAZIO
===================================================== */

.empty{
    grid-column:1/-1;

    padding:70px 20px;

    text-align:center;

    color:#8e8199;
}

.empty strong{
    display:block;

    font-family:'Cinzel',serif;

    color:#b9a9c4;

    margin-bottom:8px;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

    header{
        padding:13px 15px;
    }

    .logo{
        font-size:22px;
        letter-spacing:5px;
    }

    .user-email{
        display:none;
    }

    .user-name-header{
        max-width:90px;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .sheet{
        grid-template-columns:1fr;
    }

    .sheet-image{
        height:300px;
        min-height:0;
    }

    .sheet-placeholder{
        min-height:300px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .auth-box{
        padding:30px 22px;
    }

    .auth-logo{
        font-size:35px;
    }

    .auth-buttons{
        flex-direction:column;
    }
}

</style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">
            NEXUS
        </div>

        <div class="auth-sub">
            BESTIÁRIO DIGITAL
        </div>

        <input
            id="email"
                      type="email"
            placeholder="E-mail"
            autocomplete="email"
        >

        <input

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lyynxzzdcagchyitfwuq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_7crR8UUTz5ezFa0lHOQt7A_BRfzHvmf";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   ESTADO
===================================================== */

let currentUser = null;

let creatures = [];

let currentDangerFilter = "todos";

let currentEditingCreature = null;

let currentCreatureImage = null;

let currentProfileAvatar = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const authMessage =
    document.getElementById("authMessage");

const creatureGrid =
    document.getElementById("creatureGrid");

const editorModal =
    document.getElementById("editorModal");

const profileModal =
    document.getElementById("profileModal");

const sheetModal =
    document.getElementById("sheetModal");

const creatureForm =
    document.getElementById("creatureForm");

const music =
    document.getElementById("backgroundMusic");

const musicButton =
    document.getElementById("musicButton");


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();

            if(error){
                console.error(error);
                showAuth();
                return;
            }

            if(data.session){

                currentUser =
                    data.session.user;

                await startApp();

            }else{

                showAuth();

            }

        }catch(error){

            console.error(
                "Erro ao iniciar:",
                error
            );

            showAuth();

        }

    }
);


/* =====================================================
   OBSERVAR LOGIN
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(session){

            currentUser =
                session.user;

            if(
                event === "SIGNED_IN" ||
                event === "INITIAL_SESSION"
            ){

                await startApp();

            }

        }else{

            currentUser = null;

            showAuth();

        }

    }
);


/* =====================================================
   TELA DE LOGIN
===================================================== */

function showAuth(){

    authScreen.style.display =
        "flex";

    app.style.display =
        "none";

}


/* =====================================================
   INICIAR APP
===================================================== */

async function startApp(){

    authScreen.style.display =
        "none";

    app.style.display =
        "block";

    await loadProfile();

    await loadCreatures();

}


/* =====================================================
   MENSAGEM DE LOGIN
===================================================== */

function setAuthMessage(
    message,
    success = false
){

    authMessage.textContent =
        message;

    authMessage.style.color =
        success
            ? "#48d17b"
            : "#ff7389";

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    if(!email || !password){

        setAuthMessage(
            "Preencha o e-mail e a senha."
        );

        return;

    }

    setAuthMessage(
        "Entrando...",
        true
    );


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });


        if(error){

            setAuthMessage(
                traduzirErroAuth(error.message)
            );

            return;

        }


        currentUser =
            data.user;

        await startApp();


    }catch(error){

        console.error(error);

        setAuthMessage(
            "Não foi possível entrar."
        );

    }

}


/* =====================================================
   CRIAR CONTA
===================================================== */

async function register(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email || !password){

        setAuthMessage(
            "Preencha o e-mail e a senha."
        );

        return;

    }


    if(password.length < 6){

        setAuthMessage(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;

    }


    setAuthMessage(
        "Criando conta...",
        true
    );


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({
                email,
                password
            });


        if(error){

            setAuthMessage(
                traduzirErroAuth(error.message)
            );

            return;

        }


        if(data.session){

            currentUser =
                data.user;

            await startApp();

        }else{

            setAuthMessage(
                "Conta criada! Verifique seu e-mail para confirmar o cadastro.",
                true
            );

        }


    }catch(error){

        console.error(error);

        setAuthMessage(
            "Não foi possível criar a conta."
        );

    }

}


/* =====================================================
   TRADUZIR ERROS
===================================================== */

function traduzirErroAuth(message){

    if(!message)
        return "Ocorreu um erro.";

    if(
        message
            .toLowerCase()
            .includes("invalid login credentials")
    ){

        return "E-mail ou senha incorretos.";

    }

    if(
        message
            .toLowerCase()
            .includes("user already registered")
    ){

        return "Este e-mail já possui uma conta.";

    }

    if(
        message
            .toLowerCase()
            .includes("email not confirmed")
    ){

        return "Confirme seu e-mail antes de entrar.";

    }

    return message;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    showAuth();

}


/* =====================================================
   PERFIL
===================================================== */

async function loadProfile(){

    if(!currentUser)
        return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();


    if(error){

        console.error(
            "Erro ao carregar perfil:",
            error
        );

        updateHeader(
            null
        );

        return;

    }


    if(data){

        updateHeader(data);

    }else{

        updateHeader({
            username:
                currentUser.email
                    ?.split("@")[0]
        });

    }

}


/* =====================================================
   HEADER
===================================================== */

function updateHeader(profile){

    const name =
        profile?.username ||
        currentUser?.email
            ?.split("@")[0] ||
        "Usuário";


    document.getElementById(
        "headerUserName"
    ).textContent =
        name;


    document.getElementById(
        "headerEmail"
    ).textContent =
        currentUser?.email || "";


    const container =
        document.getElementById(
            "headerAvatar"
        );


    if(profile?.avatar_url){

        container.innerHTML = `
            <img
                class="header-avatar"
                src="${escapeAttribute(profile.avatar_url)}"
                alt="Avatar"
            >
        `;

    }else{

        container.innerHTML = `
            <div class="header-avatar-placeholder">
                👤
            </div>
        `;

    }

}


/* =====================================================
   ABRIR PERFIL
===================================================== */

async function openProfile(){

    await loadProfileData();

    profileModal.classList.add(
        "show"
    );

}


/* =====================================================
   FECHAR PERFIL
===================================================== */

function closeProfile(){

    profileModal.classList.remove(
        "show"
    );

}


/* =====================================================
   CARREGAR DADOS DO PERFIL
===================================================== */

async function loadProfileData(){

    if(!currentUser)
        return;


    const {
        data
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();


    document.getElementById(
        "profileName"
    ).value =
        data?.username || "";


    const container =
        document.getElementById(
            "profileAvatarContainer"
        );


    if(data?.avatar_url){

        container.innerHTML = `
            <img
                class="profile-avatar-preview"
                src="${escapeAttribute(data.avatar_url)}"
                alt="Avatar"
            >
        `;

    }else{

        container.innerHTML = `
            <div class="profile-avatar-placeholder">
                👤
            </div>
        `;

    }

}


/* =====================================================
   SALVAR PERFIL
===================================================== */

async function saveProfile(){

    if(!currentUser)
        return;


    const username =
        document
            .getElementById("profileName")
            .value
            .trim();


    let avatarUrl = null;


    const file =
        document
            .getElementById("profileAvatar")
            .files[0];


    try{

        const {
            data:oldProfile
        } =
            await supabaseClient
                .from("profiles")
                .select("avatar_url")
                .eq("id", currentUser.id)
                .maybeSingle();


        avatarUrl =
            oldProfile?.avatar_url ||
            null;


        if(file){

            const fileName =
                `${currentUser.id}/${Date.now()}-${sanitizeFileName(file.name)}`;


            const {
                error:uploadError
            } =
                await supabaseClient.storage
                    .from("avatars")
                    .upload(
                        fileName,
                        file,
                        {
                            upsert:true
                        }
                    );


            if(uploadError)
                throw uploadError;


            const {
                data:urlData
            } =
                supabaseClient.storage
                    .from("avatars")
                    .getPublicUrl(fileName);


            avatarUrl =
                urlData.publicUrl;

        }


        const {
            error
        } =
            await supabaseClient
                .from("profiles")
                .upsert(
                    {
                        id:
                            currentUser.id,

                        username:
                            username ||
                            currentUser.email
                                ?.split("@")[0],

                        avatar_url:
                            avatarUrl,

                        updated_at:
                            new Date()
                                .toISOString()
                    },
                                   {
                        onConflict:
                            "id"
                    }
                );


        if(error)
            throw error;


        await loadProfile();

        await loadProfileData();

        closeProfile();


        document.getElementById(
            "profileAvatar"
        ).value = "";


        alert(
            "Perfil salvo com sucesso!"
        );


    }catch(error){

        console.error(
            "Erro ao salvar perfil:",
            error
        );

        alert(
            "Não foi possível salvar o perfil: " +
            (error.message || error)
        );

    }

}


/* =====================================================
   UPLOAD DE IMAGEM — PREVIEW DA CRIATURA
===================================================== */

document
    .getElementById("creatureImage")
    ?.addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            if(!file)
                return;


            if(!file.type.startsWith("image/")){

                alert(
                    "Selecione uma imagem válida."
                );

                this.value = "";

                return;

            }


            currentCreatureImage =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const preview =
                        document.getElementById(
                            "creatureImagePreview"
                        );


                    preview.innerHTML = `
                        <img
                            src="${event.target.result}"
                            alt="Preview"
                        >
                    `;

                    document.getElementById(
                        "removeCreatureImageBtn"
                    ).style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );

   REMOVER IMAGEM DA CRIATURA
===================================================== */

/* =====================================================
   CRIAR / EDITAR CRIATURA
===================================================== */

function openCreateModal(){

    currentEditingCreature = null;

    currentCreatureImage = null;


    document.getElementById(
        "editorTitle"

/* =====================================================

===================================================== */

creatureForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser){

            alert(
                "Você precisa estar logado."
            );

            return;

        }


        const id =
            document
                .getElementById("creatureId")
                .value;


        const name =
            document
                .getElementById("creatureName")
                .value
                .trim();


        if(!name){

            alert(
                "Digite o nome da criatura."
            );

            return;

        }


        const saveButton =
            creatureForm.querySelector(
                'button[type="submit"]'
            );


        saveButton.disabled =
            true;

        saveButton.textContent =
            "SALVANDO...";


        try{

            let imageUrl =
                currentEditingCreature?.image_url ||
                null;


            /* =========================================
               UPLOAD DA IMAGEM
            ========================================= */

            if(currentCreatureImage){

                const extension =
                    currentCreatureImage.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


                const {
                    error:uploadError
                } =
                    await supabaseClient.storage
                        .from("creatures")
                        .upload(
                            fileName,
                            currentCreatureImage,
                            {
                                upsert:false
                            }
                        );


                if(uploadError)
                    throw uploadError;


                const {
                    data:urlData
                } =
                    supabaseClient.storage
                        .from("creatures")
                        .getPublicUrl(
                            fileName
                        );


                imageUrl =
                    urlData.publicUrl;

            }


            /* =========================================
               DADOS
            ========================================= */

            const creatureData = {

                name:

                    name,


                level:

                    Number(
                        document.getElementById(
                            "creatureLevel"
                        ).value
                    ) || 1,


                age:

                    document.getElementById(
                        "creatureAge"
                    ).value.trim(),


                gender:

                    document.getElementById(
                        "creatureGender"
                    ).value.trim(),


                weight:

                    document.getElementById(
                        "creatureWeight"
                    ).value.trim(),


                height:

                    document.getElementById(
                        "creatureHeight"
                    ).value.trim(),


                                role:

                    document.getElementById(
                        "creatureRole"
                    ).value.trim(),


                origin:

                    document.getElementById(
                        "creatureOrigin"
                    ).value.trim(),


                organization:

                    document.getElementById(
                        "creatureOrganization"
                    ).value.trim(),


                danger:

                    document.getElementById(
                        "creatureDanger"
                    ).value,


                image_url:

                    imageUrl,


                nexo_name:

                    document.getElementById(
                        "creatureNexoName"
                    ).value.trim(),


                nexo_state:

                    document.getElementById(
                        "creatureNexoState"
                    ).value,


                nexo_level:

                    Number(
                        document.getElementById(
                            "creatureNexoLevel"
                        ).value
                    ) || 1,


                nexo_control:

                    Number(
                        document.getElementById(
                            "creatureNexoControl"
                        ).value
                    ) || 0,


                nexo_core:

                    Math.max(
                        0,
                        Math.min(
                            100,
                            Number(
                                document.getElementById(
                                    "creatureCoreHealth"
                                ).value
                            ) || 0
                        )
                    ),


                nexo_description:

                    document.getElementById(
                        "creatureNexoDescription"
                    ).value.trim(),


                progress_level:

                    Number(
                        document.getElementById(
                            "creatureProgressLevel"
                        ).value
                    ) || 1,


                xp:

                    Number(
                        document.getElementById(
                            "creatureXP"
                        ).value
                    ) || 0,


                description:

                    document.getElementById(
                        "creatureDescription"
                    ).value.trim(),


                abilities:

                    document.getElementById(
                        "creatureAbilities"
                    ).value.trim(),


                public:

                    document.getElementById(
                        "creaturePublic"
                    ).checked

            };


            /* =========================================
               INSERIR OU ATUALIZAR
            ========================================= */

            let result;


            if(id){

                result =
                    await supabaseClient
                        .from("creatures")
                        .update(creatureData)
                        .eq("id", id)
                        .eq("user_id", currentUser.id)
                        .select()
                        .single();

            }else{

                result =
                    await supabaseClient
                        .from("creatures")
                        .insert({
                            ...creatureData,

                            user_id:
                                currentUser.id
                        })
                        .select()
                        .single();

            }


            if(result.error)
                throw result.error;


            closeEditor();

            await loadCreatures();


            alert(
                id
                    ? "Criatura atualizada com sucesso!"
                    : "Criatura criada com sucesso!"
            );


        }catch(error){

            console.error(
                "Erro ao salvar criatura:",
                error
            );


            alert(
                "Não foi possível salvar a criatura: " +
                (error.message || error)
            );


        }finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "SALVAR";

        }

    }
);


/* =====================================================
   CARREGAR CRIATURAS
===================================================== */

async function loadCreatures(){

    if(!currentUser)
        return;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("creatures")
                .select("*")
                .or(
                    `user_id.eq.${currentUser.id},public.eq.true`
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error)
            throw error;


        creatures =
            data || [];


        renderCreatures();


    }catch(error){

        console.error(
            "Erro ao carregar criaturas:",
            error
        );


        creatureGrid.innerHTML = `
            <div class="empty">

                <strong>
                    Erro ao carregar o bestiário
                </strong>

                <span>
                    ${escapeHTML(
                        error.message ||
                        "Erro desconhecido."
                    )}
                </span>

            </div>
        `;

    }

}


/* =====================================================
   FILTRO DE PERICULOSIDADE
===================================================== */

function setDangerFilter(
    danger,
    button
){

    currentDangerFilter =
        danger;


    document
        .querySelectorAll(".filter")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    renderCreatures();

}


/* =====================================================
   RENDERIZAR CRIATURAS
===================================================== */

function renderCreatures(){

    if(!creatureGrid)
        return;


    const search =
        document
            .getElementById("searchInput")
            ?.value
            .trim()
            .toLowerCase() || "";


    const filtered =
        creatures.filter(
            creature => {

                const matchesSearch =
                    !search ||
                    [
                        creature.name,
                        creature.origin,
                        creature.organization,
                        creature.role,
                        creature.nexo_name
                    ]
                    .filter(Boolean)
                    .some(
                        value =>
                            String(value)
                                .toLowerCase()
                                .includes(search)
                    );


                const matchesDanger =
                    currentDangerFilter ===
                        "todos" ||
                    creature.danger ===
                        currentDangerFilter;


                return (
                    matchesSearch &&
                    matchesDanger
                );

            }
        );


    if(!filtered.length){

        creatureGrid.innerHTML = `
            <div class="empty">

                <strong>
                    Nenhuma criatura encontrada
                </strong>

                <span>
                    Tente outra pesquisa ou crie uma nova criatura.
                </span>

            </div>
        `;

        return;

    }


    creatureGrid.innerHTML =
        filtered
            .map(
                creature =>
                    createCreatureCard(
                        creature
                    )
            )
            .join("");

}

function openSheet(

    const creature =
        creatures.find(
            item =>
                String(item.id) ===
                String(creatureId)
        );


    if(!creature)
        return;


    const danger =
        creature.danger ||
        "desconhecido";


    const dangerName =
        {
            baixo:"Baixo",

            alto:"Alto",
            extremo:"Extremo",
            desconhecido:"Desconhecido"
        }[danger] ||
        "Desconhecido";


    const core =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    creature.nexo_core

        coreColorMessage =
            "Ótimas condições, seu núcleo está perfeito!";

                )}

        } =
            await supabaseClient
                .from("creatures")
                .delete()
                .eq("id", id)
                .eq(
                    "user_id",
                    currentUser.id
                );


        if(error)
            throw error;


        closeEditor();

        await loadCreatures();


        alert(
            "Criatura excluída com sucesso!"
        );


    }catch(error){

        console.error(
            "Erro ao excluir criatura:",
            error
        );


        alert(
            "Não foi possível excluir a criatura: " +
            (error.message || error)
        );


    }finally{

        deleteButton.disabled =
            false;

        deleteButton.textContent =
            "EXCLUIR";

    }

}


/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function statHTML(
    label,
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";

    }


    return `

        <div class="stat">

            <span>
                ${escapeHTML(label)}
            </span>

            <strong>
                ${escapeHTML(value)}
            </strong>

        </div>

    `;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}


/* =====================================================
   SANITIZAR NOME DE ARQUIVO
===================================================== */

function sanitizeFileName(
    name
){

    return String(
        name || "arquivo"
    )
    .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );

}


/* =====================================================
   PREVIEW DO AVATAR
===================================================== */

document
    .getElementById("profileAvatar")
    ?.addEventListener(
        "change",
        function(){

            const file =
                this.files[0];

            if(!file)
                return;


            if(
                !file.type.startsWith(
                    "image/"
                )
            ){

                alert(
                    "Selecione uma imagem válida."
                );

                this.value = "";

                return;

            }


            currentProfileAvatar =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const container =
                        document.getElementById(
                            "profileAvatarContainer"
                        );


                    container.innerHTML = `

                        <img
                            class="profile-avatar-preview"
                            src="${event.target.result}"
                            alt="Preview do avatar"
                        >

                    `;

                };


            reader.readAsDataURL(
                file
            );

        }
    );


/* =====================================================
   MÚSICA
===================================================== */

let musicStarted = false;


function toggleMusic(){

    if(
        music.paused
    ){

        music.play()
            .then(
                () => {

                    musicStarted =
                        true;

                    musicButton.textContent =
                        "🎵 Música: ON";

                }
            )
            .catch(
                error => {

                    console.error(
                        "Erro ao tocar música:",
                        error
                    );

                    alert(
                        "Não foi possível iniciar a música. Verifique se o arquivo MP3 está na mesma pasta do HTML."
                    );

                }
            );

    }else{

        music.pause();

        musicButton.textContent =
            "🎵 Música: OFF";

    }

}

document
    .getElementById("creatureNexoLevel")
    ?.addEventListener(
        "input",
        function(){

            let value =
                Number(this.value) || 1;

            value =
                Math.max(
                    1,
                    Math.min(
                        5,
                        value
                    )
                );

            this.value =
                value;

        }
    );

    .getElementById("creatureNexoControl")
    ?.addEventListener(
        "input",
        function(){

            let value =
                Number(this.value) || 0;

            value =
                Math.max(
                    0,
                    Math.min(
                        5,
                        value
                    )
                );

            this.value =
                value;

        }
    );


document
    .getElementById("creatureCoreHealth")
    ?.addEventListener(
        "input",
        function(){

            let value =
                Number(this.value);

            if(
                Number.isNaN(value)
            ){

                value = 0;

            }

            value =
                Math.max(
                    0,
                    Math.min(
                        100,
                        value
                    )
                );

            this.value =
                value;

        }
    );
