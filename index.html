<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — BESTIÁRIO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap');

:root{
    --roxo:#9b4dff;
    --roxo2:#6d20c9;
    --fundo:#08040d;
    --painel:rgba(15,8,24,.88);
    --painel2:rgba(25,12,40,.92);
    --texto:#eee8f7;
    --muted:#a99eb5;
    --borda:rgba(155,77,255,.35);

    --baixo:#48d17b;
    --moderado:#ffd447;
    --alto:#ff8b35;
    --extremo:#ff3e5e;
    --desconhecido:#a56cff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    background:
        linear-gradient(
            rgba(8,4,13,.72),
            rgba(8,4,13,.90)
        ),
        url("https://cdn.discordapp.com/attachments/1540826842020192348/1544493761202094203/844f7e76c6e1eeb8266be6b17362b385.gif?ex=6a98b567&is=6a9763e7&hm=93698d893b995d14a8fbddce13cd1229670f3506777e621e2e7166e7425bbb71")
        center / cover fixed;

    color:var(--texto);
    font-family:Georgia, serif;
}

/* =========================
   LOGIN
========================= */

#authScreen{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(8,4,13,.65),
            rgba(8,4,13,.90)
        ),
        url("https://cdn.discordapp.com/attachments/1540826842020192348/1544493761202094203/844f7e76c6e1eeb8266be6b17362b385.gif?ex=6a98b567&is=6a9763e7&hm=93698d893b995d14a8fbddce13cd1229670f3506777e621e2e7166e7425bbb71")
        center / cover;

    z-index:9999;
}

.auth-box{
    width:min(430px,92%);
    padding:40px 35px;

    background:rgba(10,5,17,.90);

    border:1px solid var(--borda);
    border-radius:18px;

    box-shadow:
        0 0 30px rgba(155,77,255,.18),
        inset 0 0 30px rgba(155,77,255,.03);

    backdrop-filter:blur(10px);

    text-align:center;
}

.auth-logo{
    font-family:'Cinzel',serif;

    font-size:42px;
    font-weight:600;

    letter-spacing:8px;

    color:white;

    text-shadow:
        0 0 10px var(--roxo),
        0 0 25px var(--roxo),
        0 0 45px rgba(155,77,255,.4);

    margin-bottom:8px;
}

.auth-sub{
    color:var(--muted);
    margin-bottom:30px;
    font-size:14px;
}

.auth-box input{
    width:100%;

    padding:14px 15px;
    margin-bottom:12px;

    border-radius:10px;
    border:1px solid rgba(155,77,255,.3);

    background:rgba(255,255,255,.04);
    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.auth-box input:focus{
    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.25);
}

.auth-buttons{
    display:flex;
    gap:10px;
    margin-top:8px;
}

button{
    border:0;
    cursor:pointer;

    font-family:Georgia,serif;

    transition:.2s;
}

.auth-buttons button{
    flex:1;
}

.btn{
    padding:12px 18px;

    border-radius:9px;

    background:linear-gradient(
        135deg,
        var(--roxo2),
        var(--roxo)
    );

    color:white;

    box-shadow:
        0 0 15px rgba(155,77,255,.2);
}

.btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 25px rgba(155,77,255,.45);
}

.btn.secondary{
    background:rgba(255,255,255,.07);
}

.auth-message{
    min-height:20px;
    margin-top:15px;

    color:#ff7389;
    font-size:13px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 28px;

    background:rgba(7,3,11,.88);

    border-bottom:1px solid var(--borda);

    backdrop-filter:blur(12px);
}

.logo{
    font-family:'Cinzel',serif;

    margin-top:4px;

    font-size:30px;
    font-weight:600;

    letter-spacing:7px;

    color:white;

    text-shadow:
        0 0 15px rgba(155,77,255,.8),
        0 0 30px rgba(155,77,255,.35);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-email{
    color:var(--muted);
    font-size:13px;
}

.logout{
    padding:8px 12px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:#ddd;

    border:1px solid rgba(255,255,255,.08);
}

.logout:hover{
    background:rgba(255,255,255,.12);
}

/* =========================
   CONTEÚDO
========================= */

.container{
    width:min(1400px,94%);
    margin:30px auto 60px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.title-area h1{
    font-family:'Cinzel',serif;

    font-size:25px;
    letter-spacing:2px;

    color:white;
}

.title-area p{
    color:var(--muted);
    font-size:14px;
    margin-top:5px;
}

.add-btn{
    padding:13px 20px;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        var(--roxo2),
        var(--roxo)
    );

    color:white;

    box-shadow:
        0 0 20px rgba(155,77,255,.25);
}

.add-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(155,77,255,.45);
}

/* =========================
   FILTROS
========================= */

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-bottom:25px;
}

.filter{
    padding:8px 13px;

    border-radius:20px;

    background:rgba(255,255,255,.05);

    color:#cfc5d8;

    border:1px solid rgba(255,255,255,.07);

    font-size:13px;
}

.filter:hover,
.filter.active{
    background:rgba(155,77,255,.18);

    color:white;

    border-color:rgba(155,77,255,.5);
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(270px,1fr));

    gap:20px;
}

.card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,12,40,.95),
            rgba(9,5,14,.96)
        );

    border:1px solid rgba(155,77,255,.22);

    border-radius:16px;

    min-height:330px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(155,77,255,.65);

    box-shadow:
        0 15px 45px rgba(155,77,255,.18);
}

.card-image{
    height:170px;

    background:
        radial-gradient(
            circle at center,
            rgba(155,77,255,.18),
            transparent 70%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.no-image{
    font-family:'Cinzel',serif;

    color:#8c7a9b;

    font-size:12px;

    letter-spacing:2px;
}

.card-content{
    padding:16px;
}

.card-name{
    font-family:'Cinzel',serif;

    font-size:19px;
    font-weight:700;

    margin-bottom:7px;

    color:white;
}

.card-info{
    color:var(--muted);

    font-size:13px;

    line-height:1.6;
}

.card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:13px;
}

.badge{
    padding:5px 9px;

    border-radius:6px;

    font-size:11px;
    font-weight:bold;

    text-transform:uppercase;
}

.badge.baixo{
    background:rgba(72,209,123,.12);
    color:var(--baixo);
}

.badge.moderado{
    background:rgba(255,212,71,.12);
    color:var(--moderado);
}

.badge.alto{
    background:rgba(255,139,53,.12);
    color:var(--alto);
}

.badge.extremo{
    background:rgba(255,62,94,.12);
    color:var(--extremo);
}

.badge.desconhecido{
    background:rgba(165,108,255,.12);
    color:var(--desconhecido);
}

.public-label{
    font-size:11px;
    color:#8f83a0;
}

/* =========================
   MODAIS
========================= */

.modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(8px);

    z-index:5000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:92vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            rgba(24,11,38,.98),
            rgba(8,4,13,.98)
        );

    border:1px solid var(--borda);

    border-radius:18px;

    box-shadow:
        0 0 50px rgba(155,77,255,.2);

    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.modal-header h2{
    font-family:'Cinzel',serif;

    font-size:23px;

    letter-spacing:1px;
}

.close{
    width:35px;
    height:35px;

    border-radius:8px;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:18px;
}

.close:hover{
    background:rgba(255,255,255,.12);
}

/* =========================
   FORMULÁRIO
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:12px;
    color:#b9aec3;
}

.field input,
.field textarea,
.field select{
    width:100%;

    padding:11px 12px;

    border-radius:9px;

    border:1px solid rgba(155,77,255,.25);

    background:rgba(255,255,255,.04);

    color:white;

    outline:none;

    font-family:Georgia,serif;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field select option{
    background:#150b20;
    color:white;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--roxo);

    box-shadow:
        0 0 12px rgba(155,77,255,.18);
}

.section-title{
    grid-column:1/-1;

    margin-top:10px;
    padding-bottom:7px;

    border-bottom:1px solid rgba(155,77,255,.18);

    color:#c8a9e8;

    font-family:'Cinzel',serif;

    font-size:14px;

    letter-spacing:1px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:9px;

    padding:12px;

    border-radius:9px;

    background:rgba(255,255,255,.035);
}

.checkbox-row input{
    accent-color:var(--roxo);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;

    gap:10px;

    margin-top:22px;
}

.delete-btn{
    margin-right:auto;

    padding:11px 15px;

    border-radius:9px;

    background:rgba(255,62,94,.12);

    color:#ff6e85;

    border:1px solid rgba(255,62,94,.2);
}

.delete-btn:hover{
    background:rgba(255,62,94,.2);
}

/* =========================
   FICHA
========================= */

.sheet{
    display:grid;

    grid-template-columns:
        280px 1fr;

    gap:25px;
}

.sheet-image{
    min-height:330px;

    border-radius:14px;

    overflow:hidden;

    border:1px solid rgba(155,77,255,.2);

    background:rgba(255,255,255,.03);
}

.sheet-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.sheet-placeholder{
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#776980;

    font-family:'Cinzel',serif;

    font-size:12px;

    letter-spacing:2px;
}

.sheet-name{
    font-family:'Cinzel',serif;

    font-size:31px;
    font-weight:700;

    margin-bottom:8px;

    color:white;
}

.sheet-origin{
    color:#a99eb5;

    margin-bottom:18px;
}

.stats{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-bottom:20px;
}

.stat{
    padding:12px;

    border-radius:10px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.05);
}

.stat span{
    display:block;

    color:#91849b;

    font-size:11px;

    margin-bottom:4px;
}

.stat strong{
    color:white;
}

.sheet-section{
    margin-top:18px;
}

.sheet-section h3{
    font-family:'Cinzel',serif;

    color:#c8a9e8;

    font-size:15px;

    margin-bottom:8px;
}

.sheet-section p,
.sheet-section li{
    color:#c3bacb;

    font-size:14px;

    line-height:1.6;
}

.sheet-section ul{
    padding-left:20px;
}

/* =========================
   VIDA / RESISTÊNCIA
========================= */

.bar{
    height:9px;

    background:rgba(255,255,255,.08);

    border-radius:20px;

    overflow:hidden;

    margin-top:6px;
}

.bar-fill{
    height:100%;

    background:linear-gradient(
        90deg,
        #6d20c9,
        #b66cff
    );

    transition:.3s;
}

/* =========================
   MÚSICA
========================= */

.music-btn{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:8000;

    padding:12px 16px;

    border-radius:30px;

    background:rgba(18,8,28,.92);

    color:white;

    border:1px solid rgba(155,77,255,.4);

    box-shadow:
        0 0 20px rgba(155,77,255,.18);

    backdrop-filter:blur(8px);
}

.music-btn:hover{
    border-color:var(--roxo);

    box-shadow:
        0 0 25px rgba(155,77,255,.4);
}

/* =========================
   VAZIO
========================= */

.empty{
    grid-column:1/-1;

    padding:70px 20px;

    text-align:center;

    color:#8e8199;
}

.empty strong{
    display:block;

    font-family:'Cinzel',serif;

    color:#b9a9c4;

    margin-bottom:8px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    header{
        padding:13px 15px;
    }

    .logo{
        font-size:22px;
        letter-spacing:5px;
    }

    .user-email{
        display:none;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .sheet{
        grid-template-columns:1fr;
    }

    .sheet-image{
        height:300px;
        min-height:0;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .auth-box{
        padding:30px 22px;
    }

    .auth-logo{
        font-size:35px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">NEXUS</div>

        <div class="auth-sub">
            BESTIÁRIO DIGITAL
        </div>

        <input
            id="email"
            type="email"
            placeholder="E-mail"
        >

        <input
            id="password"
            type="password"
            placeholder="Senha"
        >

        <div class="auth-buttons">

            <button
                class="btn"
                onclick="login()"
            >
                ENTRAR
            </button>

            <button
                class="btn secondary"
                onclick="signup()"
            >
                CRIAR CONTA
            </button>

        </div>

        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</section>


<!-- =========================
     APP
========================= -->

<div id="app">

<header>

    <div class="logo">
        NEXUS
    </div>

    <div class="header-right">

        <span
            id="userEmail"
            class="user-email"
        ></span>

        <button
            class="logout"
            onclick="logout()"
        >
            SAIR
        </button>

    </div>

</header>


<main class="container">

    <div class="topbar">

        <div class="title-area">

            <h1>
                BESTIÁRIO
            </h1>

            <p>
                Catálogo de entidades, criaturas e ameaças.
            </p>

        </div>

        <button
            class="add-btn"
            onclick="openEditor()"
        >
            ＋ NOVA ENTIDADE
        </button>

    </div>


    <!-- FILTROS -->

    <div class="filters">

        <button
            class="filter active"
            data-filter="todos"
            onclick="setFilter('todos',this)"
        >
            TODOS
        </button>

        <button
            class="filter"
            data-filter="baixo"
            onclick="setFilter('baixo',this)"
        >
            BAIXO
        </button>

        <button
            class="filter"
            data-filter="moderado"
            onclick="setFilter('moderado',this)"
        >
            MODERADO
        </button>

        <button
            class="filter"
            data-filter="alto"
            onclick="setFilter('alto',this)"
        >
            ALTO
        </button>

        <button
            class="filter"
            data-filter="extremo"
            onclick="setFilter('extremo',this)"
        >
            EXTREMO
        </button>

        <button
            class="filter"
            data-filter="desconhecido"
            onclick="setFilter('desconhecido',this)"
        >
            ???
        </button>

        <button
            class="filter"
            data-filter="minhas"
            onclick="setFilter('minhas',this)"
        >
            MINHAS
        </button>

        <button
            class="filter"
            data-filter="publicas"
            onclick="setFilter('publicas',this)"
        >
            PÚBLICAS
        </button>

    </div>


    <div
        id="grid"
        class="grid"
    ></div>

</main>

</div>


<!-- =========================
     MODAL EDITOR
========================= -->

<div
    id="editorModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="editorTitle">
                NOVA ENTIDADE
            </h2>

            <button
                class="close"
                onclick="closeEditor()"
            >
                ×
            </button>

        </div>


        <div class="form-grid">

            <input
                type="hidden"
                id="monsterId"
            >


            <div class="field full">

                <label>
                    Nome
                </label>

                <input
                    id="name"
                    placeholder="Nome da entidade"
                >

            </div>


            <div class="field">

                <label>
                    Imagem
                </label>

                <input
                    id="image"
                    placeholder="URL da imagem"
                >

            </div>


            <div class="field">

                <label>
                    Origem
                </label>

                <input
                    id="origin"
                    placeholder="Origem"
                >

            </div>


            <div class="field">

                <label>
                    Peso
                </label>

                <input
                    id="weight"
                    placeholder="Ex: 80 kg"
                >

            </div>


            <div class="field">

                <label>
                    Altura
                </label>

                <input
                    id="height"
                    placeholder="Ex: 2,5 m"
                >

            </div>


            <div class="field">

                <label>
                    Level
                </label>

                <input
                    id="level"
                    type="number"
                    min="0"
                    placeholder="0"
                >

            </div>


            <div class="field">

                <label>
                    Perigo
                </label>

                <select id="danger">

                    <option value="baixo">
                        Baixo
                    </option>

                    <option value="moderado">
                        Moderado
                    </option>

                    <option value="alto">
                        Alto
                    </option>

                    <option value="extremo">
                        Extremo
                                        </option>

                    <option value="desconhecido">
                        ???
                    </option>

                </select>

            </div>


            <div class="section-title">
                VIDA E RESISTÊNCIA
            </div>


            <div class="field">

                <label>
                    Vida atual
                </label>

                <input
                    id="healthCurrent"
                    type="number"
                    min="0"
                    value="100"
                >

            </div>


            <div class="field">

                <label>
                    Vida máxima
                </label>

                <input
                    id="healthMax"
                    type="number"
                    min="1"
                    value="100"
                >

            </div>


            <div class="field">

                <label>
                    Resistência atual
                </label>

                <input
                    id="resistanceCurrent"
                    type="number"
                    min="0"
                    value="100"
                >

            </div>


            <div class="field">

                <label>
                    Resistência máxima
                </label>

                <input
                    id="resistanceMax"
                    type="number"
                    min="1"
                    value="100"
                >

            </div>


            <div class="section-title">
                ATRIBUTOS
            </div>


            <div class="field full">

                <label>
                    Atributos
                </label>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lyynxzzdcagchyitfwuq.supabase.co";

const SUPABASE_KEY =

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,

/* =====================================================

let currentUser = null;

/* =====================================================

/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document        .getElementById("email")
        .value
        .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email || !password){

        authMessage.textContent =
            "Preencha o e-mail e a senha.";

        return;
    }


    authMessage.style.color =
        "#ff7389";

    authMessage.textContent =
        "Entrando...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

        });


    if(error){

        authMessage.textContent =
            "E-mail ou senha incorretos.";

        return;
    }


    currentUser =
        data.user;

    authMessage.textContent = "";

    showApp();

}


/* =====================================================
   CRIAR CONTA
===================================================== */

async function signup(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email || !password){

        authMessage.textContent =
            "Preencha o e-mail e a senha.";

        return;
    }


    if(password.length < 6){

        authMessage.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

        return;
    }


    authMessage.style.color =
        "#ff7389";

    authMessage.textContent =
        "Criando conta...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signUp({

            email: email,
            password: password

        });


    if(error){

        authMessage.textContent =
            error.message;

        return;
    }


    authMessage.style.color =
        "#72e6a0";

    authMessage.textContent =
        "Conta criada com sucesso!";


    /*
       Se a confirmação de e-mail estiver
       desativada no Supabase, o usuário
       já poderá entrar automaticamente.
    */

    if(data.user){

        setTimeout(() => {

            if(data.session){

                currentUser =
                    data.user;

                showApp();

            }

        }, 800);

    }

}


/* =====================================================
   SAIR
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    monsters = [];

    app.style.display =
        "none";

    authScreen.style.display =
        "flex";

    document
        .getElementById("email")
        .value = "";

    document
        .getElementById("password")
        .value = "";

    authMessage.textContent = "";

}


/* =====================================================
   VERIFICAR SESSÃO
===================================================== */

async function checkSession(){

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if(session){

        currentUser =
            session.user;

        showApp();

    }else{

        authScreen.style.display =
            "flex";

        app.style.display =
            "none";

    }

}


/* =====================================================
   MOSTRAR APLICAÇÃO
===================================================== */

function showApp(){

    authScreen.style.display =
        "none";

    app.style.display =
        "block";


    userEmail.textContent =
        currentUser?.email || "";


    loadMonsters();

}


/* =====================================================
   CARREGAR ENTIDADES
===================================================== */

async function loadMonsters(){

    if(!currentUser)
        return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("monsters")
            .select("*")
            .or(
                `is_public.eq.true,user_id.eq.${currentUser.id}`
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Erro ao carregar entidades:",
            error
        );


        grid.innerHTML = `

            <div class="empty">

                <strong>
                    ERRO AO CARREGAR
                </strong>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;
    }


    monsters =
        data || [];


    renderMonsters();

}


/* =====================================================
   FILTROS
===================================================== */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(".filter")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );


    button.classList.add("active");


    renderMonsters();

}


/* =====================================================
   RENDERIZAR ENTIDADES
===================================================== */

function renderMonsters(){

    let list =
        [...monsters];


    if(currentFilter === "minhas"){

        list =
            list.filter(
                monster =>
                    monster.user_id ===
                    currentUser.id
            );

    }

    else if(currentFilter === "publicas"){

        list =
            list.filter(
                monster =>
                    monster.is_public === true
            );

    }

    else if(currentFilter !== "todos"){

        list =
            list.filter(
                monster =>
                    monster.danger ===
                    currentFilter
            );

    }


    if(list.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <strong>
                    NENHUMA ENTIDADE ENCONTRADA
                </strong>

                Não há criaturas correspondentes
                a este filtro.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        list
            .map(
                monster =>
                    createCard(monster)
            )
            .join("");

}


/* =====================================================
   CRIAR CARD
===================================================== */

function createCard(monster){

    const danger =
        monster.danger ||
        "desconhecido";


    const image =
        monster.image
        ?
        `
            <img
                src="${escapeHtml(
                    monster.image
                )}"
                alt="${escapeHtml(
                    monster.name ||
                    "Entidade"
                )}"
            >
        `
        :
        `
            <div class="no-image">
                SEM IMAGEM
            </div>
        `;


    return `

        <article
            class="card"
            onclick="openSheet('${monster.id}')"
        >

            <div class="card-image">

                ${image}

            </div>


            <div class="card-content">

                <div class="card-name">

                    ${escapeHtml(
                        monster.name ||
                        "SEM NOME"
                    )}

                </div>


                <div class="card-info">

                    ${
                        monster.origin
                        ?
                        escapeHtml(
                            monster.origin
                        )
                        :
                        "Origem desconhecida"
                    }

                    <br>

                    Level:
                    ${monster.level ?? 0}

                </div>


                <div class="card-footer">

                    <span
                        class="badge ${danger}"
                    >

                        ${
                            danger ===
                            "desconhecido"
                            ?
                            "???"
                            :
                            escapeHtml(danger)
                        }

                    </span>


                    <span class="public-label">

                        ${
                            monster.is_public
                            ?
                            "🌐 PÚBLICA"
                            :
                            "🔒 PRIVADA"
                        }

                    </span>

                </div>

            </div>

        </article>

    `;

}

/* =====================================================
   SALVAR ENTIDADE
===================================================== */

async function saveMonster(){

    if(!currentUser){

        alert(
            "Você precisa estar logado."
        );

        return;
    }


    const id =
        document.getElementById(
            "monsterId"
        ).value;


    const monster = {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        image:
            document.getElementById(
                "image"
            ).value.trim(),

        origin:
            document.getElementById(
                "origin"
            ).value.trim(),

        weight:
            document.getElementById(
                "weight"
            ).value.trim(),

        height:
            document.getElementById(
                "height"
            ).value.trim(),

        level:
            Number(
                document.getElementById(
                    "level"
                ).value
            ) || 0,

        danger:
            document.getElementById(
                "danger"
            ).value,

        health_current:
            Number(
                document.getElementById(
                    "healthCurrent"
                ).value
            ) || 0,

        health_max:
            Number(
                document.getElementById(
                    "healthMax"
                ).value
            ) || 1,

        resistance_current:
            Number(
                document.getElementById(
                    "resistanceCurrent"
                ).value
            ) || 0,

        resistance_max:
            Number(
                document.getElementById(
                    "resistanceMax"
                ).value
            ) || 1,

        attributes:
            document.getElementById(
                "attributes"
            ).value.trim(),

        weaknesses:
            document.getElementById(
                "weaknesses"
            ).value.trim(),

        abilities:
            document.getElementById(
                "abilities"
            ).value.trim(),

        attacks:
            document.getElementById(
                "attacks"
            ).value.trim(),

        notes:
            document.getElementById(
                "notes"
            ).value.trim(),

        is_public:
            document.getElementById(
                "isPublic"
            ).checked

    };


    if(!monster.name){

        alert(
            "Digite um nome para a entidade."
        );

        return;
    }


    let error = null;


    if(id){

        const result =
            await supabaseClient
                .from("monsters")
                .update(monster)
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


        error =
            result.error;

    }else{

        monster.user_id =
            currentUser.id;


        const result =
            await supabaseClient
                .from("monsters")
                .insert(
                    monster
                );


        error =
            result.error;

    }


    if(error){

        console.error(error);

        alert(
            "Erro ao salvar: " +
            error.message
        );

        return;
    }


    closeEditor();

    await loadMonsters();

}


/* =====================================================
   EXCLUIR ENTIDADE
===================================================== */

async function deleteMonster(){

    const id =
        document.getElementById(
            "monsterId"
        ).value;


    if(!id)
        return;


    if(

            "Tem certeza que deseja excluir esta entidade?"
        )
    ){

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("monsters")
            .delete()
            .eq(
                "id",
                id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if(error){

        alert(
            "Erro ao excluir: " +
            error.message
        );

        return;
    }


    closeEditor();

    await loadMonsters();

}


/* =====================================================
   ABRIR FICHA
===================================================== */

function openSheet(
    id
){

    const monster =
        monsters.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if(!monster)
        return;


    const isOwner =
        currentUser &&
        monster.user_id ===
        currentUser.id;


    const healthMax =
        Number(
            monster.health_max
        ) || 1;


    const healthCurrent =
        Number(
            monster.health_current
        ) || 0;


    const resistanceMax =
        Number(
            monster.resistance_max
        ) || 1;


    const resistanceCurrent =
        Number(
            monster.resistance_current
        ) || 0;


    const healthPercent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    healthCurrent /
                    healthMax
                ) * 100
            )
        );


    const resistancePercent =
        Math.max(
            0,
            Math.min(
                100,
                (
                    resistanceCurrent /
                    resistanceMax
                ) * 100
            )
        );


    document.getElementById(
        "sheetContent"
    ).innerHTML = `

        <div class="sheet">

            <div class="sheet-image">

                ${
                    monster.image
                    ?
                    `
                        <img
                            src="${escapeHtml(
                                monster.image
                            )}"
                            alt="${escapeHtml(
                                monster.name ||
                                "Entidade"
                            )}"
                        >
                    `
                    :
                    `
                        <div class="sheet-placeholder">
                            SEM IMAGEM
                        </div>
                    `
                }

            </div>


            <div>

                <div class="sheet-name">

                    ${escapeHtml(
                        monster.name ||
                        "SEM NOME"
                    )}

                </div>


                <div class="sheet-origin">

                    ${escapeHtml(
                        monster.origin ||
                        "Origem desconhecida"
                    )}

                </div>


                <div class="stats">

                    ${stat(
                        "LEVEL",
                        monster.level ?? 0
                    )}

                    ${stat(
                        "PERIGO",
                        monster.danger ===
                        "desconhecido"
                        ?
                        "???"
                        :
                        monster.danger
                    )}

                    ${stat(
                        "PESO",
                        monster.weight ||
                        "—"
                    )}

                    ${stat(
                        "ALTURA",
                        monster.height ||
                        "—"
                    )}

                </div>


                <div class="sheet-section">

                    <h3>
                        VIDA
                    </h3>

                    <p>
                        ${healthCurrent}
                        /
                        ${healthMax}
                    </p>

                    <div class="bar">

                        <div
                            class="bar-fill"
                            style="width:${healthPercent}%"
                        ></div>

                    </div>

                </div>


                <div class="sheet-section">

                    <h3>
                        RESISTÊNCIA
                    </h3>

                    <p>
                        ${resistanceCurrent}
                        /
                        ${resistanceMax}
                    </p>

                    <div class="bar">

                        <div
                            class="bar-fill"
                            style="width:${resistancePercent}%"
                        ></div>

                    </div>

                </div>


                ${sheetText(
                    "ATRIBUTOS",
                    monster.attributes
                )}


                ${sheetText(
                    "FRAQUEZAS",
                    monster.weaknesses
                )}


                ${sheetText(
                    "HABILIDADES",
                    monster.abilities
                )}


                ${sheetText(
                    "ATAQUES",
                    monster.attacks
                )}


                ${sheetText(
                    "OBSERVAÇÕES",
                    monster.notes
                )}


                ${
                    isOwner
                    ?
                    `
                        <div class="modal-actions">

                            <button
                                class="btn"
                                onclick="editFromSheet('${monster.id}')"
                            >
                                ✎ EDITAR
                            </button>

                        </div>
                    `
                    :
                    ""
                }

            </div>

        </div>

    `;


    document.getElementById(
        "sheetModal"
    ).classList.add("show");

}


/* =====================================================
   FECHAR FICHA
===================================================== */

function closeSheet(){

    document.getElementById(
        "sheetModal"
    ).classList.remove("show");

}


/* =====================================================
   EDITAR PELA FICHA
===================================================== */

function editFromSheet(
    id
){

    closeSheet();


    const monster =
        monsters.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if(monster){

        openEditor(monster);

    }

}


/* =====================================================
   ESTATÍSTICA
===================================================== */

function stat(
    title,
    value
){

    return `

        <div class="stat">

            <span>
                ${escapeHtml(title)}
            </span>

            <strong>
                ${escapeHtml(
                    String(value)
                )}
            </strong>

        </div>

    `;

}


/* =====================================================
   TEXTO DA FICHA
===================================================== */

function sheetText(
    title,
    text
){

    if(!text)
        return "";


    const formatted =
        escapeHtml(text)
            .replace(
                /\n/g,
                "<br>"
            );


    return `

        <div class="sheet-section">

            <h3>
                ${escapeHtml(title)}
            </h3>

            <p>
                ${formatted}
            </p>

        </div>

    `;

}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MÚSICA
===================================================== */

const music =
    document.getElementById(
        "musicaNexus"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


let musicPlaying =
    false;


async function toggleMusic(){

    try{

        if(musicPlaying){

            music.pause();

            musicPlaying =
                false;

            musicButton.textContent =
                "🎵 MÚSICA";

        }else{

            await music.play();

            musicPlaying =
                true;

            musicButton.textContent =
                "🔊 MÚSICA";

        }

    }catch(error){

        console.error(
            "Erro na música:",
            error
        );

        alert(
            "Não foi possível iniciar a música. Verifique se o arquivo musica.mp3 está junto do index.html."
        );

    }

}

document
    .getElementById(

        function(event){

            if(
